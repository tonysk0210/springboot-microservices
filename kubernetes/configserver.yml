# =============================================================================
# Deployment：對應 compose.yml 的 configserver，負責建立 Config Server Pod。
# ConfigMap/Secret、Probe 與 resources 分別取代 Compose 的環境、健康檢查與限制。
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: configserver-deployment
  labels:
    app: configserver
spec:
  # Pod 啟動時會從 GitHub 重新下載設定，因此 Pod 重建不會遺失設定。
  replicas: 1
  selector:
    matchLabels:
      app: configserver
  template:
    metadata:
      labels:
        app: configserver
    spec:
      containers:
        - name: configserver
          # 對應 compose.yml 的 image。
          image: anthonysk/configserver:0.0.1-SNAPSHOT
          # 如果 Kubernetes 節點已經有這個 image → 直接使用；如果沒有 → 從 Docker Hub／Registry 下載
          imagePullPolicy: IfNotPresent
          ports:
            # 對應 Compose 的 8071 port。
            - name: http
              containerPort: 8071
          # 一般設定由 ConfigMap 提供，機密由共用 Secret 提供。
          # 設定覆寫順序（簡化）：application.yml < envFrom < env < 啟動參數。
          envFrom:
            - configMapRef:
                name: configserver-config
          env:
            # 從共用 Secret 讀取加密金鑰與 RabbitMQ 憑證。
            - name: ENCRYPT_KEY
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: encrypt-key
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: rabbitmq-username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: microservices-secrets
                  key: rabbitmq-password
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 700Mi
          # 對應 Compose healthcheck；拆成啟動、就緒、存活三種 Probe。
          # clone-on-start 需先從 GitHub 取得設定，因此給較長啟動時間。
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3


---

# =============================================================================
# Service：對應 Compose 的服務入口，提供叢集內 configserver:8071。
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: configserver
  labels:
    app: configserver
spec:
  # LoadBalancer 也會嘗試提供外部入口；是否取得外部 IP 取決於 Kubernetes 環境。
  type: LoadBalancer
  selector:
    app: configserver
  ports:
    - name: http
      port: 8071            # Service 的入口／代理 port
      targetPort: http      # Pod／Container 實際接收流量的 port
      nodePort: 30071      # 讓 Compose Prometheus 可從主機抓取 K8s 指標
