# =============================================================================
# 共用 Secret：集中保存 Kubernetes 各服務使用的帳密與加密金鑰。
# Pod 不會讀取本機檔案路徑，而是依 metadata.name 引用 microservices-secrets。因此檔案名稱或所在資料夾可變，但必須先套用到同一個 namespace。
# 各服務透過 secretKeyRef 讀取需要的欄位。
# 本檔案集中管理本機 Kubernetes 測試用機密；正式環境請改用外部 Secret 管理工具。
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: microservices-secrets
type: Opaque
stringData:
  encrypt-key: "560b5cca941e67b3f6a040f1f9c2744508889f5613131b269ff4d16f6c2a3062"
  datasource-username: "root"
  datasource-password: "root"
  rabbitmq-username: "guest"
  rabbitmq-password: "guest"
