apiVersion: v1
kind: ConfigMap
metadata:
  name: configserver-config
data:
  # Jib image 使用 nobody 執行；讓 JGit 能在可寫目錄建立快取。
  HOME: "/tmp"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  # 過渡期由 Kubernetes Pod 連到 Docker Compose 管理的 RabbitMQ。
  # 等 RabbitMQ 搬進叢集並建立 rabbitmq Service 後，再改回 "rabbitmq"。
  SPRING_RABBITMQ_HOST: "host.docker.internal"
  # 明確開啟 Spring Boot 的 Kubernetes health probe endpoints。
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: eurekaserver-config
data:
  HOME: "/tmp"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  CONFIGSERVER_HOST: "configserver"
  EUREKA_HOST: "eurekaserver"
  SPRING_RABBITMQ_HOST: "host.docker.internal"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: account-config
data:
  HOME: "/tmp"
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  CONFIGSERVER_HOST: "configserver"
  EUREKA_URL: "http://eurekaserver:8070/eureka/"
  # 直接 Service 對照路徑：由 Kubernetes Service DNS 導向 Ready Pods。
  KUBERNETES_LOAN_BASE_URL: "http://loan:8090"
  KUBERNETES_CARD_BASE_URL: "http://card:9000"
  # 空字串移除 application.yaml 的 optional: 前綴，Config Server 不可缺少。
  CONFIGSERVER_OPTIONAL_PREFIX: ""
  SPRING_RABBITMQ_HOST: "host.docker.internal"
  SPRING_DATASOURCE_URL: "jdbc:mysql://host.docker.internal:3306/accountdb"
  # 連到 Compose Kafka 專門提供給本機 Kubernetes Pod 的 listener。
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "host.docker.internal:39092"
  OTLP_TRACING_ENDPOINT: "http://host.docker.internal:4318/v1/traces"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

---

