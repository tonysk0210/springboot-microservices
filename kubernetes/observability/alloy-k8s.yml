# Kubernetes Alloy：收集 Pod log，送到 Compose 的 Loki。
# Compose Alloy 則收集 Docker container log。
apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-k8s-config
data:
  config.alloy: |
    // 只發現目前 Node 上的 Pod。
    discovery.kubernetes "pod" {
      role = "pod"
      selectors {
        role  = "pod"
        field = "spec.nodeName=" + coalesce(sys.env("NODE_NAME"), constants.hostname)
      }
    }

    // 將 Pod 資訊轉成 Loki labels。
    discovery.relabel "pod_logs" {
      targets = discovery.kubernetes.pod.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        target_label  = "job"
        separator      = "/"
      }
    }

    // 從 Kubernetes API 讀取 Pod log。
    loki.source.kubernetes "pod_logs" {
      targets    = discovery.relabel.pod_logs.output
      forward_to = [loki.process.pod_logs.receiver]
    }

    // 加上環境標籤後送出。
    loki.process "pod_logs" {
      stage.static_labels {
        values = {
          cluster     = "docker-desktop",
          environment = "kubernetes",
        }
      }
      forward_to = [loki.write.default.receiver]
    }

    // Loki 在 Compose，透過主機入口連線。
    loki.write "default" {
      endpoint {
        url = "http://host.docker.internal:3100/loki/api/v1/push"
      }
    }
---
# Alloy 讀取 Pod 與 Pod log 所需的身分。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy-k8s
---
# 允許 Alloy 查看 Pod 與 Pod log。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-k8s
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
# 將上述權限綁定給 Alloy。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-k8s
subjects:
  - kind: ServiceAccount
    name: alloy-k8s
    namespace: default
roleRef:
  kind: ClusterRole
  name: alloy-k8s
  apiGroup: rbac.authorization.k8s.io
---
# 每個 Kubernetes Node 執行一個 Alloy。
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy-k8s
spec:
  selector:
    matchLabels:
      app: alloy-k8s
  template:
    metadata:
      labels:
        app: alloy-k8s
    spec:
      serviceAccountName: alloy-k8s
      containers:
        - name: alloy
          image: grafana/alloy:v1.12.0
          # 啟動 Alloy 並載入設定檔。
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          env:
            - name: NODE_NAME
              # 取得目前 Pod 所在的 Node 名稱。
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 12345
          volumeMounts:
            - name: config
              # Alloy 設定檔。
              mountPath: /etc/alloy
              readOnly: true
            - name: data
              # Alloy 暫存資料。
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-k8s-config
        - name: data
          emptyDir: {}
