# =============================================================================
#  十一個容器的編排：改成一行 docker compose up -d
#
#    rabbitmq      訊息中介。兩種用途：Bus 廣播設定刷新 + account↔messageservice 的通知
#    mysql         account / loan / card 共用的資料庫（一個容器、三個 database）
#    configserver  設定中心，其他五個向它拿設定
#    eurekaserver  服務註冊中心，四個服務在此登記、互相查找
#    account / loan / card
#    messageservice 事件驅動的通知服務（只收發訊息，沒有 HTTP API）
#    redis         Gateway 限流的計數器
#    keycloak      授權伺服器，發 token
#    gatewayserver 對外單一入口（8072），路由到三個服務
#
#  啟動順序（rabbitmq → configserver → eurekaserver → account / loan / card / gatewayserver）
#  由 depends_on + healthcheck 保證。
#  ⚠ 最後四個是「平行啟動」的，gatewayserver 不等三個服務 —— 原因見它自己那段。
#  共用設定（JVM 參數、環境變數、記憶體上限、depends_on）抽在 common.yml，用 extends 繼承。
#
#  ── 「預設不啟動」的一組，用 profile 開關 ──────────────────────────────────
#    --profile observability  loki / alloy / prometheus / tempo / grafana
#
#  ── 🔑 容器環境「一律開啟 OAuth2 驗證」，沒有開關 ──────────────────────────
#    keycloak 跟著 up 一起啟動，gatewayserver 寫死 SPRING_PROFILES_ACTIVE: auth。
#    也就是說打 API 一定要帶 token。
#
#    想在「不驗證」的狀態下測業務邏輯，用 IntelliJ 跑 gatewayserver ——
#    它預設就是不驗證的（要驗證才在 Run Configuration 填 Active profiles: auth）。
#
#    ⚠ 曾經試過用 --profile auth 同時控制「起 keycloak」和「gateway 驗不驗」，
#      但 Compose 的 profile 只能決定「服務要不要建立」，沒有語法可以條件式地
#      去改另一個服務的環境變數。硬拆成兩個開關的結果是很容易只開一半 ——
#      keycloak 起來了、gateway 卻沒驗證，而且沒有任何錯誤訊息。
#      所以改成「容器 = 完整環境、IntelliJ = 開發環境」，兩邊各自只有一種行為。
#
#  ⚠ 執行前專案根目錄要有 .env（裡面要有 ENCRYPT_KEY），沒有的話 compose 會直接失敗。
#
#  ⚠ 本檔案必須放在專案根目錄：Compose 拿「所在資料夾名」當專案名稱，所有資源都用它
#    當前綴（網路 springboot-microservices_default），.env 也是從這裡找。
#
#  ⚠ 檔名別同時放兩份。搜尋順序 compose.yaml → compose.yml → docker-compose.yaml
#    → docker-compose.yml，找到第一個就停，另一個會被「安靜地」忽略。
# =============================================================================


services:
  # ---------------------------------------------------------------------------
  #  rabbitmq —— Spring Cloud Bus 的訊息中介
  #  四個 Spring 服務都連它，所以它必須先就緒
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-ms
    ports:
      - "5672:5672"      # AMQP，服務連線用
      - "15672:15672"    # 管理介面 http://localhost:15672 （guest/guest）

    # ⚠ 這行的重點是「止血」，不是「保存資料」。
    #   rabbitmq image 的 Dockerfile 寫了 VOLUME /var/lib/rabbitmq，
    #   所以那個路徑「一定」會被掛上一塊 volume —— 你不寫，Docker 就自己開一塊
    #   亂碼名字的匿名 volume，而且每次容器重建就換一塊新的、舊的變孤兒。
    #   （實測：不寫的期間累積了 77 個孤兒 volume，約 560MB。）
    #   給名字之後每次都用同一塊，不再長孤兒。
    #
    # ⚠ 右邊的路徑不能改 —— image 的 VOLUME、RABBITMQ_DATA_DIR、HOME 三個
    #   都指向 /var/lib/rabbitmq。改成別的路徑不會少掉那塊匿名 volume，
    #   只會變成「兩塊 volume，一塊有資料一塊是空的」。
    #   查法：docker image inspect rabbitmq:4-management --format '{{json .Config.Volumes}}'
    #
    # 🔑 資料本身其實可有可無 —— Spring Cloud Bus 用的 exchange 和 queue
    #    每次服務啟動都會自動重新宣告，rabbitmq 洗掉重來也不影響。
    #    但留著的話，管理介面上手動設的東西（使用者、policy）就不會消失。
    volumes:
      - "rabbitmq-data:/var/lib/rabbitmq"

    healthcheck:
      # rabbitmq-diagnostics 是 image 內建的，不用自己裝
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s     # 前 30 秒失敗不算數（RabbitMQ 啟動要時間）
    # 它不是 Spring 服務，只需要共用的資源限制那一層
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  mysql —— account / loan / card 共用的資料庫（一個容器、三個 database）
  #
  #  🔑 這裡是「IntelliJ 和容器看到同一份資料」的關鍵：
  #        IntelliJ 跑的服務  →  localhost:3306   （靠下面的 ports 映射）
  #        容器跑的服務      →  mysql:3306       （compose 內部網路）
  #     兩條路指向同一台 MySQL，所以用哪邊建的資料另一邊都查得到。
  #     換掉 H2 的主因就是這個 —— H2 檔案模式下本機和容器是兩份完全不同的資料。
  #
  #  ⚠ 一個容器三個 database，不是三個容器。維持「每個服務一個資料庫」的原則，
  #    但只吃一份容器的記憶體。三個服務的表名雖然不衝突，仍刻意分開 schema。
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mysql-ms
    ports:
      # ⚠ 這行不能省 —— 少了它 IntelliJ 跑的服務連不到，就失去共用的意義了。
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    # ⚠ 預設的 InnoDB buffer pool 是 128M，加上其他開銷在 700m 上限下很緊，
    #   容易被 Linux OOM killer 砍掉（docker ps -a 顯示 exit 137，log 沒線索）。
    #   真的不夠就把下面 extends 的 resource-limits 拿掉、單獨寫 memory: 1g。
    command: [ "--innodb-buffer-pool-size=64M" ]

    volumes:
      - "mysql-data:/var/lib/mysql"
      # 建立三個 database 的腳本。
      # ⚠ MySQL image 「只在資料目錄是空的時候」跑這個資料夾裡的檔案 ——
      #   也就是第一次啟動、或 mysql-data volume 被刪掉之後。
      #   之後改腳本不會有任何效果，新加的 database 一直不出現。
      - "./mysql/init:/docker-entrypoint-initdb.d:ro"

    healthcheck:
      # mysqladmin 是 image 內建的，不用自己裝。
      # ⚠ 用 127.0.0.1 不用 localhost —— MySQL 對 localhost 會走 unix socket，
      #   那條路徑在服務還沒完全就緒時的行為跟 TCP 不一樣。
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      # ⚠ 第一次啟動要初始化資料目錄 + 跑 initdb，比其他容器慢很多。
      start_period: 40s

    # 不是 Spring 服務，只要記憶體上限那一層
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  configserver —— 設定中心（git 後端 + Bus 廣播 + webhook monitor）
  # ---------------------------------------------------------------------------
  configserver:
    # image 由 Jib 建：cd configserver && ./mvnw compile jib:dockerBuild
    image: anthonysk/configserver:0.0.1-SNAPSHOT
    container_name: configserver-ms
    ports:
      - "8071:8071"

    # 用 configserver-base 而不是 microservice-base —— 它的設定來自自己的
    # application.yaml，不向 Config Server 拿。
    extends:
      file: common.yml
      service: configserver-base

    environment:
      # 只有 configserver 需要的加密金鑰，從 .env 讀。
      # ⚠ :? 語法 = 沒設就讓 compose 直接失敗。刻意 fail fast，因為
      #   configyml/*.yml 的 email 是 {cipher} 密文，沒金鑰會解成
      #   invalid.account.contact-details.email = <n/a>，服務拿到 null ——
      #   那種「啟動成功但資料錯」比啟動失敗難查得多。
      ENCRYPT_KEY: ${ENCRYPT_KEY:?請先在專案根目錄建立 .env 並填入 ENCRYPT_KEY}

      # 消掉 JGit 的 "Cannot save config file '/.config/jgit/config'" 錯誤堆疊。
      # Jib 產的 image 用 nobody(65534) 跑，而容器裡 HOME 是 /（root 擁有，755），
      # JGit 想在 $HOME/.config/jgit 寫一份時間戳精度的快取就會被權限擋下來。
      # ⚠ 純粹是噪音 —— clone 實際落在 /tmp/config-repo-xxx，設定供應完全正常。
      #   但那是一整段 ERROR + stack trace，會蓋掉真正該看的東西。
      HOME: /tmp

    healthcheck:
      # 🔑 healthcheck 是「在容器裡面」執行的，所以打 127.0.0.1（容器自己），
      #    跟上面 ports: 有沒有對外映射完全無關。
      # ⚠ 用 127.0.0.1 不用 localhost：image 的 /etc/hosts 裡 localhost 同時對應
      #   127.0.0.1 和 ::1，BusyBox wget 挑哪個不保證。healthcheck 失敗會卡住整條
      #   depends_on 依賴鏈，用確定的位址比較安全。
      # ⚠ 用 wget 不用 curl —— alpine 基底只有 BusyBox wget。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8071/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      # ⚠ 60s：configserver 設了 clone-on-start，啟動時要先 clone 整個 GitHub repo，
      #   比其他服務慢。給太短會一直被判 unhealthy，三個服務就永遠等不到。
      start_period: 60s

  # ---------------------------------------------------------------------------
  #  eurekaserver —— 服務註冊中心（單機模式）
  #  儀表板 http://localhost:8070
  # ---------------------------------------------------------------------------
  eurekaserver:
    # image 由 Jib 建：cd eurekaserver && ./mvnw compile jib:dockerBuild
    image: anthonysk/eurekaserver:0.0.1-SNAPSHOT
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"

    # 用 configserver-base 而不是 microservice-base —— 前者帶 JVM 參數、
    # SPRING_RABBITMQ_HOST、depends_on rabbitmq；後者還會帶 EUREKA_URL 和
    # depends_on eurekaserver（自己等自己，死鎖）。
    #
    # ⚠ RabbitMQ 那層是「加了 spring-cloud-starter-bus-amqp 之後才需要」的。
    #   沒有 SPRING_RABBITMQ_HOST 的話容器裡會去連 localhost:5672（= 容器自己），
    #   背景無限重連，log 很吵。
    extends:
      file: common.yml
      service: configserver-base

    environment:
      # ⚠⚠ 最關鍵的一行 ⚠⚠
      #   application.yml 寫的是 hostname: ${EUREKA_HOST:localhost}，
      #   不設的話 Eureka 會用 localhost 算出自己的 defaultZone。
      #   單機模式下它「還是會動」（peer 清單照樣是空的），但儀表板顯示的
      #   自身位址會是 localhost，之後做 peer replication 時一定出錯。
      EUREKA_HOST: eurekaserver

      # 向 configserver 拿 configyml/eurekaserver.yml。
      # ⚠ 目前那個檔案是空的，這趟往返拿回零個設定 —— 純粹是為了跟其他服務
      #   寫法一致。哪天真的不需要，把 pom 的 spring-cloud-starter-config、
      #   application.yml 的 config.import、這行、下面的 depends_on 一起拿掉，
      #   eurekaserver 就完全不依賴任何人。
      CONFIGSERVER_HOST: configserver

    # ⚠ 這裡刻意「不設」SPRING_CLOUD_CONFIG_FAIL_FAST。
    #   三個微服務設 true 是因為它們真的需要遠端設定（拿不到就等於壞了）；
    #   eurekaserver 拿到的是空的，fail fast 只會讓它平白多一個死因。
    #
    # ⚠ rabbitmq 那項由 configserver-base 帶進來（合併，不是覆蓋）。
    depends_on:
      configserver:
        condition: service_healthy

    healthcheck:
      # Jib + alpine 基底 → 有 BusyBox wget，寫法跟 configserver / account / card 相同。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8070/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  account —— 帳戶與客戶資料
  # ---------------------------------------------------------------------------
  account:
    # 🔑 這個 key 就是「DNS 名稱」—— 其他容器用 http://account:8080 找它。
    #    認的是這個 key，不是下面的 container_name。
    #
    # 本檔案「只負責跑，不負責建」，四個 image 都要自己先建好。
    # ⚠ 本機沒有這個 image 時，Compose 會改去 Docker Hub 拉，然後報
    #   pull access denied —— 那訊息很誤導，實際上只是你還沒 build。
    image: anthonysk/account:0.0.1-SNAPSHOT

    # ⚠ 寫死名字好認，代價是不能再 --scale（同名會衝突）。
    #   不寫的話會自動命名 springboot-microservices-account-1。
    container_name: account-ms

    ports:
      - "8080:8080"
    #    ↑主機  ↑容器
    #  ⚠ 這行只影響主機端。容器之間互相呼叫走內部網路，不需要 ports，
    #    而且用的永遠是右邊那個容器 port。

    # JVM 參數、SPRING_RABBITMQ_HOST、CONFIGSERVER_HOST、記憶體上限、
    # depends_on（rabbitmq + configserver）全部來自 common.yml
    extends:
      file: common.yml
      service: microservice-base

    # ── 資料庫（共用的 mysql 容器）──────────────────────────────────────────
    #
    # ⚠ 這裡只覆寫 URL —— 帳密由 common.yml 的 microservice-base 帶進來，
    #   因為三個服務的帳密相同、但 database 各自不同。
    #
    # 🔑 mysql 是「服務名 = DNS 名」。IntelliJ 那側走 localhost:3306
    #    （application.yaml 的預設值），兩條路指向同一台 MySQL。
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/accountdb"

    # ⚠ 硬依賴：連不上資料庫的話 Hibernate 建不出 EntityManagerFactory，
    #   服務直接啟動失敗（不是重試，是掛掉）。
    #   而 MySQL 第一次啟動要初始化資料目錄 + 建三個 database，比誰都慢。
    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  loan —— 貸款資料
  # ---------------------------------------------------------------------------
  loan:
    # image 是 Buildpacks 產的：cd loan && ./mvnw spring-boot:build-image
    image: anthonysk/loan:0.0.1-SNAPSHOT
    container_name: loan-ms
    ports:
      - "8090:8090"
    extends:
      file: common.yml
      service: microservice-base

    environment:
      # ⚠ loan 專屬：修掉 Paketo 記憶體計算器把 heap 壓到 46MB 的問題。
      #   症狀是啟動途中 OutOfMemoryError: Java heap space。
      #   算法（見啟動 log 的 Calculated JVM Memory Configuration）：
      #     700M − 10M direct − 157M metaspace − 240M code cache
      #          − 250M thread stack（預設假設 250 條 × -Xss1M）= 43M 給 heap
      #
      #   common.yml 的 MaxRAMPercentage=75 對 loan 無效 —— Paketo 會把自己算的
      #   -Xmx 追加在後面，而 -Xmx 優先權更高。account / card 不經過 Paketo，
      #   所以那行對它們正常生效。
      #
      #   降到 50 就把 200M 還給 heap（約 243MB）。
      #   ⚠ 這只改「計算假設」，不限制實際執行緒數。
      BPL_JVM_THREAD_COUNT: 50

      # 共用的 mysql 容器，各自的 database。完整說明見 account 那段。
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/loandb"

    depends_on:
      mysql:
        condition: service_healthy

    # ⚠ loan 的 healthcheck 寫法跟 account / card 不一樣，因為它是 Buildpacks 產的。
    #   Paketo 預設的 run image（ubuntu-noble-run-tiny）走 distroless 路線，
    #   連 /bin/sh 都沒有，任何指令都跑不起來 → 永遠 unhealthy。
    #   解法是在 loan/pom.xml 把 runImage 換成 paketobuildpacks/run-noble-base，
    #   換完有了 bash —— 但「還是沒有 wget 和 curl」，所以不能照抄上面兩個服務。
    #
    #   改用 bash 內建的 /dev/tcp 自己講 HTTP：
    #     exec 3<>/dev/tcp/主機/埠  bash 開一條 TCP 連線，綁到檔案描述子 3
    #     echo -e "..." >&3         把 HTTP 請求寫進去（\r\n 是 HTTP 規定的換行）
    #     grep -q ... <&3           讀回應，找到 "status":"UP" 就 exit 0
    #
    # ⚠ 一定要寫 "CMD", "bash" 不能用 CMD-SHELL —— CMD-SHELL 走 /bin/sh，
    #   而這個 image 的 /bin/sh 是 dash，dash 沒有 /dev/tcp 這個功能。
    # ⚠ 外層用 YAML 單引號，裡面的 \r\n 才會原封不動交給 echo -e 去解釋；
    #   用雙引號的話 YAML 會先把它換成真正的換行字元。
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8090 && echo -e "GET /actuator/health HTTP/1.0\r\n\r" >&3 && grep -q "\"status\":\"UP\"" <&3' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  card —— 信用卡資料
  # ---------------------------------------------------------------------------
  card:
    # image 是 Jib 產的：cd card && ./mvnw compile jib:dockerBuild
    image: anthonysk/card:0.0.1-SNAPSHOT
    container_name: card-ms
    ports:
      - "9000:9000"
    extends:
      file: common.yml
      service: microservice-base

    # 共用的 mysql 容器，各自的 database。完整說明見 account 那段。
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/carddb"

    depends_on:
      mysql:
        condition: service_healthy

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:9000/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  messageservice —— 事件驅動的通知服務（模擬寄信 / 發簡訊）
  #
  #  🔑 本專案唯一「不走 HTTP」的服務：沒有 Controller、不註冊 Eureka、
  #     gateway 也沒有它的路由。全部靠 RabbitMQ 收發：
  #         account ──send-communication──▶ 我 ──communication-sent──▶ account
  #
  #  ⚠ 用 configserver-base 不是 microservice-base ——
  #    它沒有 Config Client 也沒有 Eureka Client，那層帶的
  #    CONFIGSERVER_HOST / EUREKA_URL / H2 設定對它全都沒有作用。
  #    只需要 configserver-base 的 SPRING_RABBITMQ_HOST 和 JVM 參數。
  #
  #  ⚠ 刻意「不」depends_on account —— 兩者透過 exchange 解耦，
  #    誰先起來都沒關係。account 早起的話訊息會在 queue 裡等著。
  # ---------------------------------------------------------------------------
  messageservice:
    # image 由 Jib 建：cd messageservice && ./mvnw compile jib:dockerBuild
    image: anthonysk/messageservice:0.0.1-SNAPSHOT
    container_name: messageservice-ms
    ports:
      # ⚠ 這個 port 只給 /actuator/health 和 function-web 的測試端點用，
      #   業務流量完全走 RabbitMQ，不經過它。
      - "9010:9010"

    extends:
      file: common.yml
      service: configserver-base

    environment:
      # microservice-base 才有這一項，這裡單獨補上（它有裝 OpenTelemetry）。
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces

    healthcheck:
      # Jib + alpine 基底 → 有 BusyBox wget，寫法同 configserver / eurekaserver / card。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:9010/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  #  redis —— Gateway 限流（RequestRateLimiter）的計數器
  #
  #  ⚠ 為什麼不能存在 gateway 的記憶體裡：多台 gateway 會各算各的，
  #    「每秒 1 次」變成實際可以打 N 次。Redis 是那份「共用的計數器」，
  #    而且 Gateway 內建的 Lua 腳本保證多台同時加也不會算錯。
  #
  #  資料長這樣（key 就是 KeyResolver 回傳的字串）：
  #      request_rate_limiter.{alice}.tokens
  #      request_rate_limiter.{anonymous}.tokens
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: redis-ms
    ports:
      - "6379:6379"    # 主機端連進來看資料用（docker exec redis-ms redis-cli）

    # ⚠ 刻意「不掛 volume」—— 限流計數本來就是短命資料（秒級），
    #   重啟後歸零反而是乾淨的起點。跟 rabbitmq 不同，那個 image 有
    #   VOLUME 指令會自動長匿名 volume，redis 官方 image 沒有，不用擔心孤兒。
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]    # 回 PONG 就算健康
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    # 不是 Spring 服務，只要記憶體上限那一層
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  keycloak —— 授權伺服器（發 token 的那一方）
  #
  #  🔑 刻意「不」設 profile —— 跟著 docker compose up -d 一起啟動。
  #     因為 gatewayserver 寫死了 SPRING_PROFILES_ACTIVE: auth，沒有它就沒人發 token，
  #     所有請求都會 401。兩者是綁在一起的，分開只會製造「只開一半」的坑。
  #
  #  管理介面 http://localhost:7080 （admin / admin，可用 .env 覆寫）
  #
  #  🔑 角色分工：Keycloak 只管「你是誰、有哪些角色」，不知道有哪些 API；
  #     「這個角色能不能打這支 API」是 gatewayserver 的 SecurityConfig 決定的。
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak-ms
    ports:
      # 左邊 7080 是主機端（8080 被 account 佔了），右邊 8080 是容器內的固定埠。
      # ⚠ 容器之間互連要用 keycloak:8080，不是 localhost:7080。
      #
      # ⚠⚠ 前面的 127.0.0.1 不能省 —— 沒寫的話 Docker 綁 0.0.0.0，
      #     同一個 WiFi / 網段的任何人都連得到這台的 Keycloak 管理介面，
      #     而帳密是 admin/admin。其他容器不受影響（走的是內部網路，不經過這層映射）。
      - "127.0.0.1:7080:8080"

    # start-dev = 開發模式：內建 H2、不要求 HTTPS、關掉快取。
    # ⚠ 正式環境要用 start 並接外部資料庫，start-dev 的資料庫不保證可升級。
    command: [ "start-dev" ]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # token 裡的 iss（發行者）固定成這個位址。
      # ⚠ 目前 gateway 用 jwk-set-uri 驗證，「不會」檢查 iss，所以少了這行也能通。
      #   但哪天改用 issuer-uri（那會連 iss 一起驗），「用 localhost:7080 拿 token、
      #   gateway 用 keycloak:8080 驗」就會變成 invalid_token。先設好，到時不用回頭補。
      KC_HOSTNAME: http://localhost:7080

    volumes:
      # ⚠⚠ 這行很重要 —— 先前手動 docker run 的容器「沒有」掛 volume，
      #     realm、client（含 secret）、role、user 全存在容器層，docker rm 就全沒了。
      #     start-dev 用的 H2 檔案就在 /opt/keycloak/data 底下。
      - "keycloak-data:/opt/keycloak/data"

    # 刻意不設 healthcheck：Keycloak 26 的健康檢查在另一個管理埠（9000），
    # 而 image 裡沒有 curl / wget，寫起來要繞一大圈。沒有別的容器 depends_on 它，
    # 少這一項不影響啟動順序（同 loki 的做法）。

    # 不是 Spring 服務，只要記憶體上限那一層
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  gatewayserver —— 對外單一入口
  #
  #  外面只需要開 8072 一個 port，三個服務的 8080 / 8090 / 9000 其實可以全部關掉
  #  （目前留著是為了直接打單一服務除錯、開各自的 swagger-ui）。
  #
  #      http://localhost:8072/bank/account/api/fetch-account
  #      http://localhost:8072/bank/loan/api/fetch-loan
  #      http://localhost:8072/bank/card/api/fetch-card
  # ---------------------------------------------------------------------------
  gatewayserver:
    # image 由 Jib 建：cd gatewayserver && ./mvnw compile jib:dockerBuild
    image: anthonysk/gatewayserver:0.0.1-SNAPSHOT
    container_name: gatewayserver-ms
    ports:
      - "8072:8072"

    # 跟三個服務用同一層 —— 它同樣要向 Config Server 拿設定、要註冊到 Eureka、
    # 要連 RabbitMQ 收 Bus 廣播。
    #
    # ⚠ 這層會順帶帶進資料庫的帳密。gatewayserver 沒有資料庫，
    #   那兩個設定不會有任何作用（Spring 對不認識的 property 直接忽略），
    #   留著只是為了不用再多開一層 base。
    #   🔑 但 depends_on mysql 刻意「不」放在那一層 —— 那會讓 gateway 白等
    #      資料庫就緒，而它根本不需要。
    extends:
      file: common.yml
      service: microservice-base

    # ⚠ 這裡刻意「不」depends_on account / loan / card。
    #
    #   路由是 RouteConfig 寫死的（lb://ACCOUNT），路由表在啟動時就建好，
    #   跟三個服務在不在完全無關 —— 服務沒起就是回 503，等它們註冊到 Eureka
    #   之後 30 秒內自動可用。
    #
    #   加了 depends_on 反而把「各自獨立部署」綁回去：任何一個服務重啟，
    #   Gateway 也要跟著等。
    #
    # ⚠ 唯一的例外是自動路由（discovery.locator.enabled: true）——
    #   那時路由「從 Eureka 名冊生成」，名冊空的就沒有路由，打進來是 404。
    #   本專案設 false，所以不受影響。

    environment:
      # 限流計數器的位址。直接覆蓋 Spring 的 spring.data.redis.host，
      # 所以 gatewayserver 的 application.yaml「什麼都不用寫」——
      # Spring Boot 預設就是 localhost:6379，本機跑剛好對，容器跑由這行蓋掉。
      # （跟 SPRING_RABBITMQ_HOST 同一種風格；CONFIGSERVER_HOST / EUREKA_URL
      #   則是另一種：自訂變數，yaml 要配合寫 ${VAR:預設值}。）
      SPRING_DATA_REDIS_HOST: redis

      # 🔑 容器環境一律開啟 OAuth2 驗證，寫死不做成開關。
      #    對應 application-auth.yaml（jwk-set-uri）和 SecurityConfig（@Profile("auth")）。
      #    ⚠ 所以打任何 /bank/** 的 API 都要帶 Bearer token，不帶一律 401。
      #    ⚠ 想在不驗證的狀態下測業務邏輯，用 IntelliJ 跑 —— 它預設不驗證。
      SPRING_PROFILES_ACTIVE: auth

      # ⚠ 容器裡要用服務名 keycloak:8080 —— 用 localhost:7080 的話，
      #   那個 localhost 是 gateway 容器自己，不是主機。
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/master/protocol/openid-connect/certs

    # ⚠ redis 必須先就緒 —— 少了它 gateway「還是會啟動成功」，
    #   但第一個經過限流 filter 的請求就爆 Connection refused。
    #   那種「啟動正常、一打就死」比啟動失敗難查得多。
    # ⚠ rabbitmq / configserver / eurekaserver 三項由 microservice-base 帶進來（合併，不是覆蓋）。
    #
    # ⚠ 這裡刻意「不」depends_on keycloak —— 用 jwk-set-uri 時公鑰是
    #   「第一次驗 token 才去抓」，不是啟動時，所以 gateway 比 Keycloak 早起
    #   完全沒問題。加了只會讓 gateway 白等 Keycloak 那段偏慢的啟動時間。
    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      # Jib + alpine 基底 → 有 BusyBox wget，寫法同 configserver / eurekaserver。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8072/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ###########################################################################
  # ###########################################################################
  # ##                                                                       ##
  # ##            以下為「觀測性」堆疊，跟上面的微服務完全分開                  ##
  # ##                                                                       ##
  # ##   平常不會啟動（profiles: observability）。要用時多加一個參數：          ##
  # ##       docker compose --profile observability up -d                    ##
  # ##   只關觀測性：                                                         ##
  # ##       docker compose --profile observability stop loki alloy grafana  ##
  # ##                                                                       ##
  # ##   三個角色，用監視器比喻：                                              ##
  # ##       alloy    攝影機 —— 從 Docker 撈所有容器的 log                     ##
  # ##       loki     硬碟   —— 存起來、提供查詢                              ##
  # ##       grafana  螢幕   —— 畫面 http://localhost:3000                    ##
  # ##                                                                       ##
  # ##   資料流：容器印 log → Docker 收著 → alloy 撈走 → loki 存 → grafana 看  ##
  # ##                                                                       ##
  # ##   設定檔放在 observability/，一個資料夾一個角色：                        ##
  # ##       observability/alloy/config.alloy                                ##
  # ##       observability/grafana/datasource.yml                            ##
  # ##   （loki 用 image 內建的預設設定，不需要設定檔）                         ##
  # ##                                                                       ##
  # ##   ⚠ 刻意「不用」Grafana 官方範例那份 7 容器的架構                       ##
  # ##     （read/write/backend 拆分 + nginx + MinIO）——                     ##
  # ##     那是在示範水平擴充，本機用不到，而且 MinIO 佔用 9000 會撞到 card。   ##
  # ##                                                                       ##
  # ##   之後要加 Prometheus（指標）和 Tempo（追蹤）就加在這個區塊裡。          ##
  # ##   ⚠ 那兩個「必須」跟微服務同網路（Prometheus 要主動抓 /actuator，        ##
  # ##     Tempo 要接收服務送來的 span）——合併進本檔案就是為了這件事。         ##
  # ##     Log 反而不需要同網路，因為 alloy 是問 Docker 不是問容器。           ##
  # ##                                                                       ##
  # ###########################################################################
  # ###########################################################################

  # ---------------------------------------------------------------------------
  #  loki —— log 的儲存與查詢（「硬碟」）
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.6.2
    container_name: loki-ms
    profiles: [ "observability" ]
    ports:
      - "3100:3100"    # alloy 往這裡推送，grafana 從這裡查詢

    # ⚠ 不掛任何設定檔 —— image 內建的 /etc/loki/local-config.yaml 就是
    #   「單體模式 + 存本機檔案」，正是本機開發要的。
    #   官方範例那份 loki-config.yaml 綁死了 memberlist 和 MinIO，
    #   少了那些容器會直接啟動失敗，所以刻意不用。
    volumes:
      - "loki-data:/loki"

    # ⚠ 刻意「沒有 healthcheck」—— 這個 image 是 distroless：
    #     沒有 sh、沒有 wget、沒有 curl，任何指令都跑不起來
    #     Grafana 官方範例寫的 loki -health 在 3.6.2 已經被移除（flag not defined）
    #   所以下面兩個服務用 service_started 而不是 service_healthy。
    #   代價很小：alloy 推不進去會自己重試，grafana 查不到重整一下就好。
    #   要確認它活著就從主機打：curl http://localhost:3100/ready → ready

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  alloy —— log 收集代理（「攝影機」）
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.12.0
    container_name: alloy-ms
    profiles: [ "observability" ]
    ports:
      - "12345:12345"    # Alloy 自己的除錯畫面 http://localhost:12345

    volumes:
      # 設定檔（唯讀）
      - "./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro"
      # 🔑 關鍵的一行：把 Docker 的控制通道掛進去。
      #    alloy 靠它直接問 Docker 要所有容器的 log，不需要跟那些容器同網路，
      #    也不需要對方配合 —— 跟你打 docker logs 是同一個來源。
      # ⚠ 代價：拿到這個等於對 Docker 有完全控制權（能建能刪任何容器）。
      #   本機開發無所謂，正式環境要用受限的 socket proxy。
      - "/var/run/docker.sock:/var/run/docker.sock"

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    depends_on:
      loki:
        condition: service_started   # loki 沒有 healthcheck，見上方說明

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  prometheus —— 指標的收集與儲存  http://localhost:9090
  #
  #  🔑 跟 loki 的方向相反：
  #      loki       被動等 alloy 推進來
  #      prometheus 主動每 15 秒去打六個服務的 /actuator/prometheus
  #
  #  ⚠ 所以它「必須」跟微服務在同一個網路 —— 這就是把觀測性合併進本檔案
  #    而不是放另一份 compose 的主要理由。log 反而不需要。
  #
  #  查抓取狀態：http://localhost:9090/targets （每個服務是 UP 還是 DOWN）
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus-ms
    profiles: [ "observability" ]
    ports:
      - "9090:9090"    # ⚠ 跟 card 的 9000 不同，不會撞

    volumes:
      # 巡邏名單（去哪抓、多久抓一次）
      - "./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      # 指標資料。不留的話容器重建就從零開始，歷史圖表全沒了。
      - "prometheus-data:/prometheus"

    # ⚠ 掛了自訂設定檔就必須把 command 整組寫出來 ——
    #   image 內建的 CMD 會被覆蓋，少寫 --storage.tsdb.path 那行資料就不會寫進 volume。
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle          # 允許 POST /-/reload 熱載入設定，不用重啟

    # prometheus.yml 的 targets 用 host.docker.internal（原因見那個檔案的說明）。
    # ⚠ 那個名字在 Docker Desktop（Windows / Mac）是內建的，這行是多餘的；
    #   但在 Linux 的 Docker Engine 沒有內建，少了它全部 target 會 DOWN。
    #   加著不會衝突，換到 Linux 環境時省下一次「為什麼壞掉」的查修。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  tempo —— 追蹤（trace）的儲存與查詢  http://localhost:3200
  #
  #  🔑 三支柱的收集方向，這是第三種：
  #      Log      alloy 去 Docker 撈        → 服務不知情
  #      Metrics  Prometheus 來抓           → 服務被動
  #      Traces   服務「主動送」過來         → 服務要知道 Tempo 在哪
  #
  #  ⚠ 所以四個服務的 yaml 都設了 OTLP endpoint。少設一個，那個服務的 span
  #    就不會出現，瀑布圖會缺一段 —— 而且不會有任何錯誤訊息。
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.9.0
    container_name: tempo-ms
    profiles: [ "observability" ]
    ports:
      - "3200:3200"    # 查詢（Grafana 資料源指這裡）
      - "4318:4318"    # OTLP / HTTP  ← 服務送 span 用這個
      - "4317:4317"    # OTLP / gRPC（本專案用不到，開著備用）

    # ⚠ 要 root —— Tempo 的 image 用非 root 跑，但 volume 掛上來時目錄是
    #   root:root 755，寫不進去會直接啟動失敗。跟 account 的 H2 同一個問題。
    user: root

    volumes:
      - "./observability/tempo/tempo.yml:/etc/tempo.yml:ro"
      - "tempo-data:/var/tempo"

    command: [ "-config.file=/etc/tempo.yml" ]

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  grafana —— 查詢畫面（「螢幕」）  http://localhost:3000
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana-ms
    profiles: [ "observability" ]
    ports:
      - "3000:3000"

    environment:
      # 免登入，直接進去就是管理員。⚠ 只適合本機。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

    volumes:
      # 開機時自動掛好 Loki 資料源，不用手動在畫面上設定。
      # ⚠ 右邊的路徑不能改，Grafana 只掃這個資料夾。
      - "./observability/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro"
      # 讓你在畫面上存的儀表板不會因為容器重建而消失
      - "grafana-data:/var/lib/grafana"

    depends_on:
      loki:
        condition: service_started   # loki 沒有 healthcheck，見上方說明
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

    extends:
      file: common.yml
      service: resource-limits


# =============================================================================
#  named volume 宣告
#
#  ⚠ 這一段跟 services: 同一層（最外層，不縮排）。
#    上面服務寫了 "mysql-data:/var/lib/mysql" 卻沒在這裡宣告的話，compose 直接拒絕：
#        service "mysql" refers to undefined volume mysql-data
#
#  冒號後面留空 = 用預設設定（driver: local），位置交給 Docker 決定。
#  compose 會自動加上專案名前綴，實際名稱是 springboot-microservices_mysql-data。
# =============================================================================
volumes:
  mysql-data:        # account / loan / card 三個 database 都在這一塊裡
  rabbitmq-data:
  keycloak-data:     # realm / client / role / user —— 沒有它，容器一重建設定就全沒
  # ── 觀測性用（只有 --profile observability 時才會建立）──────────────────────
  loki-data:         # log 本體，不留的話容器重建就全沒了
  prometheus-data:   # 指標的歷史資料
  tempo-data:        # 追蹤資料（tempo.yml 設保留 24h）
  grafana-data:      # 你在畫面上存的儀表板


# =============================================================================
#  為什麼沒有 networks: 區塊
#
#  不需要 —— Compose 一定會自動建一個網路（springboot-microservices_default）並把所有服務接上去。自訂網路自帶 Docker 內建 DNS，所以服務之間可以用名字互相呼叫。
#
#  ⚠ 這不是 compose 獨有的能力，手動 docker network create + --network 也做得到。
#    真正做不到的只有「不指定 --network 的 docker run」—— 那會落到預設 bridge，
#    而預設 bridge 不提供容器名稱解析，只能用會變動的 IP。
#
#  ⚠ 名字只在「容器世界」有效：
#      從哪裡呼叫        localhost:8080   account:8080
#      Windows 瀏覽器        ✅              ❌
#      另一個容器            ❌（指自己）      ✅
#
#  什麼時候才真的要寫 networks:？做分層隔離時 —— 例如 gateway 只接 frontend、
#  db 只接 backend，讓 gateway 在網路層就碰不到 db。現在五個服務地位平等，
#  寫了也只是換個名字。
# =============================================================================


# =============================================================================
#  常用指令（PowerShell，在專案根目錄執行）
#
#  ── 先建 image（本檔案不負責建，改過程式碼一定要重跑對應那行）─────────────
#  cd configserver;   ./mvnw compile jib:dockerBuild                       （Jib）
#  cd eurekaserver;   ./mvnw compile jib:dockerBuild                       （Jib）
#  cd account;        docker build -t anthonysk/account:0.0.1-SNAPSHOT .   （Dockerfile）
#  cd loan;           ./mvnw spring-boot:build-image "-Dmaven.test.skip=true"（Buildpacks）
#  cd card;           ./mvnw compile jib:dockerBuild                       （Jib）
#  cd messageservice; ./mvnw compile jib:dockerBuild                       （Jib）
#  cd gatewayserver;  ./mvnw compile jib:dockerBuild                       （Jib）
#
#  ⚠ 六個服務刻意用三種不同的建置方式（Jib / Dockerfile / Buildpacks），
#    是為了對照各自的優缺點 —— 正式專案應該統一成一種。
#  ⚠ 沒建就 up 的話錯誤訊息是 pull access denied（很誤導）——
#    實際上只是本機還沒有這個 image，跟權限無關。
#
#  ⚠ 本機若還有 IntelliJ / mvnw 跑著同樣的服務，port 會衝突
#    （8070 / 8071 / 8072 / 8080 / 8090 / 9000 / 5672），up 之前先停掉。
#
#  ── 跑 ────────────────────────────────────────────────────────────────────
#  docker compose up -d              全部啟動
#  docker compose up -d account      只重啟一個（image 重建後用這個換掉舊容器）
#  docker compose ps                 看狀態（含 port 與健康狀態）
#  docker compose logs -f            看 log（混流，每行標服務名）
#  docker compose exec account sh    進容器
#  docker compose down               收工（容器 + 網路一起清）
#
#  ── 驗證（Keycloak）──────────────────────────────────────────────────────
#  ⚠ 沒有開關，up -d 就有。打 /bank/** 一定要帶 Bearer token，不帶就是 401。
#    先去 http://localhost:7080 拿 token（admin/admin），Postman 設定見專案筆記。
#  ⚠ down 不會刪 volume，Keycloak 裡建的 client / role 會留著。
#    真要清空（會失去所有 client / role / user）：docker compose down -v
#
#  ── port 收斂（模擬正式環境）──────────────────────────────────────────────
#  docker compose -f compose.yml -f compose.prod.yml up -d
#    account / loan / card 的 port 不對外，只剩 8072 一個入口。
#  ⚠ 之後每個指令都要帶同樣的 -f，或設 $env:COMPOSE_FILE = "compose.yml;compose.prod.yml"
#
#  ── 資料庫 ────────────────────────────────────────────────────────────────
#  docker exec mysql-ms mysql -uroot -proot -e "SHOW DATABASES;"
#  docker exec mysql-ms mysql -uroot -proot accountdb -e "SELECT * FROM accounts;"
#
#  ⚠ 改了表結構（schema.sql）之後要重建資料庫，因為 CREATE TABLE IF NOT EXISTS
#    對既有的表沒有作用，ddl-auto: validate 會讓服務啟動失敗：
#      只清一個  docker exec mysql-ms mysql -uroot -proot -e "DROP DATABASE accountdb; CREATE DATABASE accountdb;"
#      全部重來  docker compose rm -sf mysql; docker volume rm springboot-microservices_mysql-data; docker compose up -d mysql
#
#  ── 推到 GitHub Packages（可選）───────────────────────────────────────────
#  .\push-images-to-ghcr.ps1
#
#  ── 驗證服務互連 ──────────────────────────────────────────────────────────
#  docker compose exec account sh
#  wget -qO- http://configserver:8071/actuator/health    → {"status":"UP"}
#
#  ── 主機端可開的網址 ──────────────────────────────────────────────────────
#    http://localhost:8072/bank/account/api/fetch-account?mobileNumber=...
#                                                  ↑ 正式入口，走 Gateway
#    http://localhost:8072/actuator/gateway/routes 目前生效的路由表
#    http://localhost:8080/swagger-ui/index.html   account（8090 loan、9000 card）
#    localhost:3306                                MySQL（root/root，DBeaver 或
#                                                  IntelliJ Database 直接連）
#    http://localhost:8071/account/default         configserver 提供給 account 的設定
#    http://localhost:8070                         Eureka 儀表板（四個服務都該在上面）
#    http://localhost:15672                        RabbitMQ 管理介面
#    http://localhost:7080                         Keycloak 管理介面（admin/admin）
#
#  ⚠ 改了程式碼、重建 image 之後一定要再 up 一次 —— 已在跑的容器不會自動換。
#    好消息是 Compose 會偵測 image 變了並重建容器，不必像 docker run 先手動 rm -f。
# =============================================================================


# =============================================================================
#  資料庫的演進紀錄（這一段是「為什麼變成現在這樣」，不是待辦）
#
#  ── 曾經：H2 記憶體模式 ──────────────────────────────────────────────────
#  三個 image 在建置階段把資料庫設成 jdbc:h2:mem:xxx，容器一關資料就蒸發。
#
#  ── 然後：H2 檔案模式 + 三個 volume ──────────────────────────────────────
#  改成 jdbc:h2:file:/data/xxx 並各掛一塊 volume，資料留得住了。
#  但暴露出三個持續踩到的問題：
#      ① 本機和容器是「兩份不同的資料」
#         IntelliJ 跑 → ~/h2db/xxx（Windows 家目錄）
#         容器跑     → volume 裡（WSL2）
#         用 IntelliJ 建的帳戶，切成容器就查不到。
#      ② schema.sql 是 CREATE TABLE IF NOT EXISTS，加新欄位對既有資料庫無效，
#         ddl-auto: validate 直接讓服務啟動失敗，只能刪檔重建。
#      ③ 檔案在 WSL2 的 volume 裡，Windows 的 DBeaver 看不到，
#         只能靠容器內的 h2-console 看資料（還要額外開 WEB_ALLOW_OTHERS）。
#      ⚠ 還要 user: root，因為非 root 的 image 寫不進 Docker 新建的 /data。
#
#  ── 現在：一個 mysql 容器、三個 database ─────────────────────────────────
#  上面三個問題一次解決：
#      ① 兩邊連同一台 —— IntelliJ 走 localhost:3306、容器走 mysql:3306
#      ② 改結構就 docker volume rm mysql-data 重建（見 account/sql/schema.sql）
#      ③ DBeaver / IntelliJ Database 直接連 localhost:3306
#
#  🔑 Java 程式碼一行都沒改 —— 因為 application.yaml 從一開始就把 URL 寫成
#     ${SPRING_DATASOURCE_URL:...}，而且刻意沒寫死 database-platform，
#     Hibernate 會自己從連線挑方言。這是當初留的伏筆，這次真的用上了。
#     ⚠ 但 driverClassName / username / password 當初「沒有」做成佔位符，
#       那三行是這次唯一被卡住的地方 —— 現在 driverClassName 直接刪掉
#       （Boot 從 URL 推斷），帳密改成 ${VAR:預設}。
#
#  ── 還沒做的 ─────────────────────────────────────────────────────────────
#  ⚠ 用 root 連資料庫，三個服務共用同一組帳密。正式環境該每個 database
#    一個專用帳號，只授權它自己那個 schema。
#  ⚠ 改表結構仍然要「刪掉重建」。欄位一多就該換 Flyway 或 Liquibase ——
#    它們會記錄哪些遷移跑過了，不用每次清空資料。
#  ⚠ Keycloak 仍然用它自己的 H2（start-dev），沒有跟著搬過來。
# =============================================================================
