# =============================================================================
# Compose 服務編排：
#   開發環境：`docker compose up -d`
#   開發環境 + 觀測性：`docker compose --profile observability up -d`
#   正式環境：`docker compose -f compose.yml -f compose.prod.yml up -d`
#   正式環境 + 觀測性：`docker compose -f compose.yml -f compose.prod.yml --profile observability up -d`
#
# `compose.prod.yml` 是正式環境覆寫檔；觀測性服務需額外啟用 profile。
# 核心服務包含業務服務、RabbitMQ、Kafka、MySQL、Redis、Eureka、Config Server、Gateway、Keycloak 與 MessageService；共用設定由 common.yml 提供。
#
# 觀測性服務 Loki、Alloy、Prometheus、Tempo、Grafana 預設不啟動，需加上：
# `docker compose --profile observability up -d`。
#
# 容器環境固定啟用 Gateway OAuth2 驗證，呼叫 API 必須攜帶 Keycloak token。
# 本機若要測試未驗證模式，直接用 IntelliJ 啟動 Gateway；需要驗證時再啟用 auth profile。
#
# 執行前請確認專案根目錄有 `.env`（包含 ENCRYPT_KEY），且本檔案位於專案根目錄。
#
# 個別建置七個自建服務 image（PowerShell）：
# Account 使用專案內的 Dockerfile（會在 image 內編譯並打包）：
# `docker build -t anthonysk/account:0.0.1-SNAPSHOT .\account`
# Loan 使用 Spring Boot Buildpacks：
# 只建立本機 image：
# `cd loan; .\mvnw.cmd spring-boot:build-image "-Dmaven.test.skip=true"`
# 建立後直接推送 Docker Hub：
# `cd loan; .\mvnw.cmd spring-boot:build-image "-Dmaven.test.skip=true" "-Dspring-boot.build-image.publish=true"`
# Card、Config Server、Eureka Server、Gateway、MessageService 使用 Jib：
# `cd card; .\mvnw.cmd compile jib:dockerBuild`
# `cd configserver; .\mvnw.cmd compile jib:dockerBuild`
# `cd eurekaserver; .\mvnw.cmd compile jib:dockerBuild`
# `cd gatewayserver; .\mvnw.cmd compile jib:dockerBuild`
# `cd messageservice; .\mvnw.cmd compile jib:dockerBuild`
# 建置後可用 `docker compose up -d --force-recreate <service>` 更新單一容器。
# =============================================================================


services:
  # ---------------------------------------------------------------------------
  #  account —— 帳戶與客戶資料
  # ---------------------------------------------------------------------------
  account:
    # account 是其他容器呼叫本服務時使用的 DNS 名稱（account:8080）。
    # image 不在本機時，Compose 會嘗試從 registry 下載。
    image: anthonysk/account:0.0.1-SNAPSHOT
    # 固定容器名稱，方便在 Docker Desktop 或 CLI 辨識；因此不適合用 --scale 擴充。
    container_name: account-ms
    # 固定 Eureka 顯示的主機名稱；不影響 Compose DNS 或對外 port。
    hostname: account-ms
    # 8080:8080 = 主機 port:容器 port；容器互連直接使用 account:8080。
    ports:
      - "8080:8080"

    # 使用 mysql service；帳密由 common.yml 提供，這裡指定 accountdb 資料庫。
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/accountdb"
      # loan、card 是 compose.yml 的 service 名稱，也是 Compose network 內的 DNS 名稱；直接透過它們呼叫下游服務，不使用 Eureka。
      KUBERNETES_LOAN_BASE_URL: "http://loan:8090"
      KUBERNETES_CARD_BASE_URL: "http://card:9000"
      # 容器使用 kafka:9092；本機程式使用 localhost:29092。
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    # 容器啟動後先等待 120 秒，再每 10 秒檢查一次；單次最多等 5 秒，連續失敗 5 次才標記為不健康。
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

    # 複用資料庫業務服務的共用設定。
    extends:
      file: common.yml
      service: database-microservice-base

    # Kafka 健康後才啟動 Account；MySQL 依賴由 database-microservice-base 提供。
    depends_on:
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  loan —— 貸款資料
  # ---------------------------------------------------------------------------
  loan:
    image: anthonysk/loan:0.0.1-SNAPSHOT
    container_name: loan-ms
    # 設定容器內的 HOSTNAME，讓分流觀測 log 顯示 loan-ms；不影響 DNS 或服務路由。 Kubernetes 會自動使用 Pod 名稱，不需另外設定。
    hostname: loan-ms
    ports:
      - "8090:8090"
    environment:
      # 讓 Paketo 以 50 條執行緒估算記憶體，替 JVM heap 保留更多空間，避免 heap 太小而 OOM；不會限制實際執行緒數。
      BPL_JVM_THREAD_COUNT: 50
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/loandb"

    # Buildpacks image 沒有 wget/curl，使用 bash 的 /dev/tcp 檢查健康端點。
    healthcheck:
      test: [ "CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8090 && echo -e "GET /actuator/health HTTP/1.0\r\n\r" >&3 && grep -q "\"status\":\"UP\"" <&3' ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

    extends:
      file: common.yml
      service: database-microservice-base

  # ---------------------------------------------------------------------------
  #  card —— 信用卡資料
  # ---------------------------------------------------------------------------
  card:
    image: anthonysk/card:0.0.1-SNAPSHOT
    container_name: card-ms
    # 設定容器內的 HOSTNAME，讓分流觀測 log 顯示 card-ms；不影響 DNS 或服務路由。 Kubernetes 會自動使用 Pod 名稱，不需另外設定。
    hostname: card-ms
    ports:
      - "9000:9000"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/carddb"

    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:9000/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

    extends:
      file: common.yml
      service: database-microservice-base

  # ---------------------------------------------------------------------------
  # rabbitmq：Spring Cloud Bus 的訊息中介，服務透過它廣播 refresh 事件。
  # ---------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-ms
    ports:
      - "5672:5672"      # AMQP，服務連線用
      - "15672:15672"    # 管理介面 http://localhost:15672 （guest/guest）

    # 使用 named volume 保存 RabbitMQ 設定，避免容器重建產生匿名 volume。
    # Bus exchange/queue 會自動重建；volume 主要保存使用者與 policy。
    volumes:
      - "rabbitmq-data:/var/lib/rabbitmq"

    healthcheck:
      # 使用 image 內建工具檢查 AMQP port 是否可連線。
      test: [ "CMD", "rabbitmq-diagnostics", "check_port_connectivity" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s     # 前 30 秒失敗不算數（RabbitMQ 啟動要時間）
    # RabbitMQ 不是 Spring 服務，只套用共用資源限制。
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  configserver —— 設定中心（git 後端 + Bus 廣播 + webhook monitor）
  # ---------------------------------------------------------------------------
  configserver:
    # 以 Jib 建置：cd configserver && ./mvnw compile jib:dockerBuild
    image: anthonysk/configserver:0.0.1-SNAPSHOT
    container_name: configserver-ms
    ports:
      - "8071:8071"

    environment:
      # 從 .env 讀取金鑰；未設定即失敗，避免 {cipher} 設定解密後變成 null。
      ENCRYPT_KEY: ${ENCRYPT_KEY:?請先在專案根目錄建立 .env 並填入 ENCRYPT_KEY}

      # 讓 JGit 快取寫入可寫目錄，避免權限錯誤堆疊。
      HOME: /tmp

    healthcheck:
      # 容器內以 BusyBox wget 連 127.0.0.1，避開 localhost 的 IPv4/IPv6 差異。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8071/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      # clone-on-start 需要時間，避免過早判定為 unhealthy。
      start_period: 60s

    extends:
      # 使用自身 application.yaml，不向 Config Server 取設定。
      file: common.yml
      service: spring-bus-base

  # ---------------------------------------------------------------------------
  #  mysql —— 一個容器提供 account、loan、card 三個 database。
  #  IntelliJ 使用 localhost:3306；Compose 服務使用 mysql:3306，資料共用同一個 volume。
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8.4
    container_name: mysql-ms
    ports:
      # 將容器的 MySQL port 提供給本機 IntelliJ 使用。
      - "3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?請在 .env 設定 MYSQL_ROOT_PASSWORD}

    # 減少 InnoDB buffer pool，讓容器在記憶體上限內穩定運作。
    command: [ "--innodb-buffer-pool-size=64M" ]

    volumes:
      # 保留 MySQL 資料；刪除 volume 才會清空資料庫。
      - "mysql-data:/var/lib/mysql"
      # 將專案的 ./mysql/init 掛載到 MySQL 固定掃描的初始化目錄；(./mysql/init 是相對於 compose.yml 所在的專案根目錄) 空資料 volume 第一次啟動時，依檔名順序執行其中的 SQL。
      - "./mysql/init:/docker-entrypoint-initdb.d:ro"

    healthcheck:
      # 使用 image 內建的 mysqladmin，透過 TCP 檢查 MySQL 是否可連線。
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1" ]
      interval: 10s
      timeout: 5s
      retries: 10
      # 預留時間給第一次資料庫初始化。
      start_period: 40s

    # 不是 Spring 服務，只要記憶體上限那一層
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  eurekaserver —— 服務註冊中心（單機模式）儀表板 http://localhost:8070
  # ---------------------------------------------------------------------------
  eurekaserver:
    image: anthonysk/eurekaserver:0.0.1-SNAPSHOT
    container_name: eurekaserver-ms
    ports:
      - "8070:8070"

    environment:
      # Compose 內的 Eureka 主機名稱；未設定時 application.yml 預設為 localhost。
      EUREKA_HOST: eurekaserver

    healthcheck:
      # 使用 image 內建的 wget 檢查 Eureka 健康端點。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8070/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  gatewayserver —— 對外唯一入口（localhost:8072）。
  #  /bank/account、/bank/loan、/bank/card 由 Gateway 轉發到各服務。
  #  /k8s/account 透過 Compose/Kubernetes Service DNS 直接呼叫 Account。
  # ---------------------------------------------------------------------------
  gatewayserver:
    image: anthonysk/gatewayserver:0.0.1-SNAPSHOT
    container_name: gatewayserver-ms
    hostname: gatewayserver-ms
    ports:
      - "8072:8072"

    environment:
      # 透過 Eureka 找到 account / loan / card。
      EUREKA_URL: http://eurekaserver:8070/eureka/
      # 容器內將 trace 傳送至 Tempo。
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      # 容器內 Redis 的服務名稱；供 Gateway 限流使用。
      SPRING_DATA_REDIS_HOST: redis
      # Compose 以服務 DNS 直接呼叫 account，不經 Eureka。
      ACCOUNT_DIRECT_BASE_URL: http://account:8080
      # 容器環境啟用 OAuth2；呼叫 /bank/** 必須帶 Bearer token。
      SPRING_PROFILES_ACTIVE: auth
      # 容器內使用 Keycloak 服務名稱，不能使用容器自己的 localhost。
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/master/protocol/openid-connect/certs

    healthcheck:
      # 檢查 Gateway 健康端點。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8072/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    extends:
      file: common.yml
      service: resource-limits

    # Eureka、Redis、Account、Loan、Card 必須 healthy 後 Gateway 才啟動。
    # 不等待 Keycloak：驗證 token 時才取得公鑰。
    depends_on:
      eurekaserver:
        condition: service_healthy
      redis:
        condition: service_healthy
      account:
        condition: service_healthy
      loan:
        condition: service_healthy
      card:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  redis —— Gateway RequestRateLimiter 共用的限流計數器。
  #  多個 Gateway instance 透過 Redis 共用額度；key 由 KeyResolver 產生
  # ---------------------------------------------------------------------------
  redis:
    image: redis:8-alpine
    container_name: redis-ms
    ports:
      - "6379:6379"  # 供主機端查看 Redis 資料。

    # 不掛 volume；限流計數是短暫資料，Redis 重啟後重新計算即可。
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    # 非 Spring 服務，只套用記憶體限制。
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  loki —— 儲存與查詢日誌。
  # ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.6.2
    container_name: loki-ms
    profiles: [ "observability" ]
    ports:
      - "3100:3100"    # Alloy 往這寫入、Grafana 查詢。

    # 使用 image 內建設定，採單體模式並將資料存到本機 volume。
    volumes:
      - "loki-data:/loki"

    # 提高 Alloy 推送日誌批次的大小上限，避免較大的 log batch 被 Loki 拒絕。
    command:
      # 使用 Loki image 內建的本機單體模式設定檔。
      - "-config.file=/etc/loki/local-config.yaml"
      # 限制每次接收的 gRPC 訊息大小為 16 MiB。
      - "-distributor.max-recv-msg-size=16777216"
      # 將 Loki gRPC 伺服器接收上限設為 16 MiB，與 distributor 一致。
      - "-server.grpc-max-recv-msg-size-bytes=16777216"
      # 允許接收 168 小時（7 天）內的舊日誌，避免 Alloy 重播 Docker 日誌時被拒絕。
      - "-validation.reject-old-samples.max-age=168h"

    # 不設 healthcheck：image 沒有可用的 shell 或 wget；Alloy 會自行重試。
    # 可從主機確認：http://localhost:3100/ready
    extends:
      file: common.yml
      service: resource-limits


  # ---------------------------------------------------------------------------
  #  alloy —— 收集 Docker 日誌並送到 Loki。
  # ---------------------------------------------------------------------------
  alloy:
    image: grafana/alloy:v1.12.0
    container_name: alloy-ms
    profiles: [ "observability" ]
    ports:
      - "12345:12345"    # Alloy 管理介面。

    volumes:
      # 將專案內的 Alloy 設定檔掛載到容器；容器只能讀取，不能修改主機檔案。
      - "./observability-config/alloy/config.alloy:/etc/alloy/config.alloy:ro"
      # 讀取所有 Docker container 的日誌；此 socket 幾乎等同 Docker 管理權限，正式環境應改用受限的 socket proxy。
      - "/var/run/docker.sock:/var/run/docker.sock"

    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy

    extends:
      file: common.yml
      service: resource-limits

    depends_on:
      loki:
        condition: service_started   # Loki 沒有 healthcheck。

  # ---------------------------------------------------------------------------
  #  prometheus —— 收集並儲存各服務指標  http://localhost:9090
  #  每 15 秒主動抓取 /actuator/prometheus；狀態可在 /targets 查看。
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus-ms
    profiles: [ "observability" ]
    ports:
      - "9090:9090"

    volumes:
      # Prometheus 抓取目標與頻率設定。
      - "./observability-config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      # 保存歷史指標；移除後重建會從零開始。
      - "prometheus-data:/prometheus"

    # 使用自訂設定檔時，需明確指定設定檔與資料目錄。
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle          # 允許 POST /-/reload 熱載入設定。

    # 讓容器可解析 host.docker.internal；Linux Docker Engine 需要這項設定。
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # 以 Prometheus 健康端點確認服務是否正常。
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/healthy" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  grafana —— 顯示 Loki、Prometheus、Tempo 資料  http://localhost:3000
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:12.3.0
    container_name: grafana-ms
    profiles: [ "observability" ]
    ports:
      - "3000:3000"

    environment:
      # 開發環境免登入並使用管理員權限；正式環境請關閉。
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"

    volumes:
      # 啟動時自動建立資料源，不必手動設定。
      - "./observability-config/grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro"
      # 保存儀表板與 Grafana 設定，避免容器重建後遺失。
      - "grafana-data:/var/lib/grafana"

    depends_on:
      loki:
        condition: service_started   # Loki 沒有 healthcheck。
      prometheus:
        condition: service_started
      tempo:
        condition: service_started

    # 由 Docker 定期檢查 Grafana 是否正常。
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  tempo —— 儲存與查詢 OpenTelemetry trace  http://localhost:3200
  #  服務透過 OTLP 主動送 span；Grafana 從 Tempo 查詢瀑布圖。
  # ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.9.0
    container_name: tempo-ms
    profiles: [ "observability" ]
    ports:
      - "3200:3200"    # Grafana 查詢用。
      - "4318:4318"    # OTLP／HTTP，服務送 span 用。
      - "4317:4317"    # OTLP／gRPC，預留使用。

    # 以 root 執行，確保能寫入 tempo-data volume。
    user: root

    volumes:
      - "./observability-config/tempo/tempo.yml:/etc/tempo.yml:ro"
      - "tempo-data:/var/tempo"

    command: [ "-config.file=/etc/tempo.yml" ]

    # 以 /ready 端點確認 Tempo 是否就緒。
    healthcheck:
      test: [ "CMD", "/busybox/wget", "-qO-", "http://127.0.0.1:3200/ready" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  #  keycloak —— OAuth2 授權伺服器，負責登入、角色與 JWT token。
  #  不設 profile，啟動 Compose 時一併啟動；管理介面：http://localhost:7080。
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.1
    container_name: keycloak-ms
    ports:
      # 主機使用 7080，容器內使用 8080；其他容器請連 keycloak:8080。
      # 綁定 127.0.0.1，只允許本機存取；若只寫 7080:8080，Docker 一般未指定 ip 通常會綁定 0.0.0.0，管理介面可能暴露給區域網路。
      - "127.0.0.1:7080:8080"

    # 開發模式：使用內建 H2、不要求 HTTPS；正式環境應改用外部資料庫與正式模式。
    command: [ "start-dev" ]

    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}

      # 設定 JWT 的 issuer 位址；改用 issuer-uri 時會檢查此值。
      KC_HOSTNAME: http://localhost:7080

    volumes:
      # 保存 realm、client、role、user 與 H2 資料，重建容器後仍可保留。
      - "keycloak-data:/opt/keycloak/data"

    # 不設 healthcheck；目前沒有服務以 depends_on 等待 Keycloak。

    # 不是 Spring 服務，只要記憶體上限那一層
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  # kafka：與 RabbitMQ 並存的事件 broker。
  # RabbitMQ 訊息通常消費後移除；Kafka 事件會保留在 topic，可依 offset 重播。
  # 使用 KRaft 單節點模式，不需要 ZooKeeper；副本數必須設為 1。
  # ---------------------------------------------------------------------------
  
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-ms
    ports:
      # Kafka 會回報 advertised listener 位址，因此不同環境使用不同 listener：
      # INTERNAL=kafka:9092（Compose）、EXTERNAL=localhost:29092（主機）、
      # KUBERNETES=host.docker.internal:39092（本機 Kubernetes）。
      - "29092:29092"
      - "39092:39092"

    environment:
      # KRaft 單節點：同時扮演 broker 與 controller。
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # 客戶端 listener 與 controller listener。
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,KUBERNETES://:39092,CONTROLLER://:9093
      # Broker 會回報與客戶端環境相符的位址。
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092,KUBERNETES://host.docker.internal:39092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,KUBERNETES:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # 單節點只能使用 1 份副本；預設 3 會導致啟動失敗。
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # 本機單節點不需等待 Consumer 重新分配。
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Kafka 訊息與 offset 的儲存位置。
      KAFKA_LOG_DIRS: /var/lib/kafka/data

    volumes:
      # 保留訊息與 offset，容器重建後仍可重播。
      - "kafka-data:/var/lib/kafka/data"

    healthcheck:
      # 能列出 topic 代表 Broker 已可用。
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      # 預留 KRaft 初始化與格式化儲存目錄的時間。
      start_period: 45s

    # 不是 Spring 服務，只要記憶體上限那一層
    extends:
      file: common.yml
      service: resource-limits

  # ---------------------------------------------------------------------------
  # messageservice：事件驅動的通知服務，模擬寄信與發簡訊。
  # 業務流程不經 Gateway／Eureka，RabbitMQ 與 Kafka 各自完成通知往返：Account → MessageService → Account
  # ---------------------------------------------------------------------------
  messageservice:
    image: anthonysk/messageservice:0.0.1-SNAPSHOT
    container_name: messageservice-ms
    ports:
      # 僅供 healthcheck 與 function-web 測試端點使用；業務訊息走 RabbitMQ／Kafka。
      - "9010:9010"

    environment:
      # 指定 Tempo 的 OTLP 端點。
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces
      # 容器使用 Kafka INTERNAL listener；本機則使用 localhost:29092。
      SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"

    healthcheck:
      # 使用 image 內建 wget 檢查服務是否健康。
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:9010/actuator/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

    extends:
      file: common.yml
      service: spring-bus-base

    depends_on:
      kafka:
        condition: service_healthy

# =============================================================================
# Named volumes：保存服務資料，避免容器重建後遺失。
# 與 services 同層；未指定 driver 時使用 Docker 預設的 local volume。
# =============================================================================
volumes:
  mysql-data:        # account、loan、card 共用的資料庫資料
  kafka-data:        # Kafka topic 訊息與 consumer offset
  rabbitmq-data:
  keycloak-data:     # Keycloak realm、client、role 與 user
  # 觀測性服務使用；啟用 observability profile 時才建立。
  loki-data:         # Loki logs
  prometheus-data:   # Prometheus metrics 歷史資料
  tempo-data:        # Tempo traces
  grafana-data:      # Grafana dashboards 與設定


# =============================================================================
# 預設 network：所有 services 自動加入，可用 service name 互相呼叫。
# =============================================================================
networks:
  default:
    name: springboot-microservices_default
    driver: bridge
