# =============================================================================
#  compose.yml 的 extends 共用設定，由通用到專用：
#
#    resource-limits     只有記憶體上限          ← 所有容器共用
#        ↓
#    spring-bus-base     + 連 RabbitMQ            ← Spring Cloud Bus 用
#        ↓
#    microservice-base   + Config Server、Eureka、OTel
#        ↓
#    database-microservice-base + MySQL 帳密      ← account / loan / card 用
#
#  這些 service 不會啟動，只作為設定範本；引用方可覆寫 environment。
#  healthcheck 因各服務 port 不同，保留在 compose.yml。
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  resource-limits —— 所有容器可共用的資源限制
  # ---------------------------------------------------------------------------
  resource-limits:
    deploy:
      resources:
        limits:
          # 單一容器上限；總額須低於 Docker Desktop 的可用記憶體。
          memory: 800m

  # ---------------------------------------------------------------------------
  #  spring-bus-base —— Spring Cloud Bus 與 RabbitMQ 的共用設定
  # ---------------------------------------------------------------------------
  spring-bus-base:
    extends:
      service: resource-limits
    environment:
      # 容器內以 Compose DNS 連 RabbitMQ。
      SPRING_RABBITMQ_HOST: rabbitmq

    depends_on:
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  microservice-base —— 業務服務的 Config Server、Eureka、OTel 與共用依賴
  # ---------------------------------------------------------------------------
  microservice-base:
    extends:
      service: spring-bus-base
    environment:
      # application.yaml 透過此主機名組出 Config Server 位址。
      CONFIGSERVER_HOST: configserver

      # Eureka API 位址；結尾的 /eureka/ 為必要路徑。
      EUREKA_URL: http://eurekaserver:8070/eureka/

      # 容器不使用 optional:，Config Server 不可用即啟動失敗。
      CONFIGSERVER_OPTIONAL_PREFIX: ""

      # 容器內將 trace 傳送至 Tempo。
      OTLP_TRACING_ENDPOINT: http://tempo:4318/v1/traces

    # 等待共用基礎服務可用。
    depends_on:
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  #  database-microservice-base —— 使用 MySQL 的業務服務共用設定
  # ---------------------------------------------------------------------------
  database-microservice-base:
    extends:
      service: microservice-base
    environment:
      # 從 .env 注入共用的 MySQL 帳密；各服務的資料庫 URL 在 compose.yml 宣告。
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?請在 .env 設定 SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?請在 .env 設定 SPRING_DATASOURCE_PASSWORD}
    depends_on:
      # 使用資料庫的服務須等待 MySQL 就緒。
      mysql:
        condition: service_healthy
