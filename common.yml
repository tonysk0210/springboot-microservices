# =============================================================================
#  compose.yml 的共用設定，用 extends 繼承。三層由通用到專用：
#
#    resource-limits     只有記憶體上限          ← rabbitmq 用（它不是 Spring 服務）
#        ↓
#    configserver-base   + JVM 參數、連 RabbitMQ  ← configserver 用
#        ↓
#    microservice-base   + 向 Config Server 拿設定 ← account / loan / card 用
#
#  🔑 這裡的服務「不會被啟動」—— extends 只是把設定複製給引用它的服務。
#     docker compose config 展開後看不到這些名字，只會看到內容被併進去。
#  ⚠ 本檔案不能單獨 docker compose up（服務都沒有 image），它只是設定庫。
#
#  合併規則（實測過）：
#    environment  合併，同名 key 由引用方（compose.yml）勝出
#    depends_on   會被帶過來（Compose V2 支援，舊版 docker-compose v1 不支援）
#    healthcheck  刻意不放這裡 —— 每個服務 port 不同，共用價值低
# =============================================================================

services:

  resource-limits:
    # ⚠ deploy 原本是 Swarm 專用欄位，舊版 docker-compose（v1，有橫線）會忽略它。
    #   等價的簡單寫法是 mem_limit: 700m。
    deploy:
      resources:
        limits:
          # ⚠ 超過上限「不會」拋 OutOfMemoryError，是被 Linux OOM killer 直接砍掉，
          #   docker ps -a 顯示 exit code 137，log 通常什麼線索都不留。
          #   五個容器 × 700m = 3.5GB，記得確認 Docker Desktop 的 WSL2 配額夠。
          memory: 700m

  configserver-base:
    extends:
      service: resource-limits      # 同檔案內引用，不用寫 file:
    environment:
      # 不設的話 JVM 只拿記憶體上限的 25% 當 heap（700m 下只有 175MB）。
      # ⚠ 對 loan 無效 —— Paketo 會把自己算的 -Xmx 追加在後面，優先權更高。
      #   詳見 compose.yml 裡 loan 的 BPL_JVM_THREAD_COUNT 那段。
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"

      # ⚠ 覆寫 application.yaml 的 localhost —— 容器裡的 localhost 是容器自己。
      SPRING_RABBITMQ_HOST: rabbitmq

    depends_on:
      rabbitmq:
        condition: service_healthy

  microservice-base:
    extends:
      service: configserver-base
    environment:
      # 只換「主機名」，不換整條 import 字串。
      # application.yaml 寫的是 http://${CONFIGSERVER_HOST:localhost}:8071/，
      # 所以本機跑 → localhost，容器跑 → configserver。
      #
      # ⚠ 為什麼不直接設 SPRING_CONFIG_IMPORT 覆寫整條？因為它「不會覆寫」——
      #   spring.config.import 是由 ConfigData 機制逐個設定來源分別處理的，
      #   yaml 一份、環境變數一份，兩份都會執行。實測結果：容器裡先連
      #   configserver:8071（成功），再連 localhost:8071（Connection refused），
      #   每次啟動和每次 refresh 都噴一輪 WARN。程式沒壞，但假警報很礙事。
      CONFIGSERVER_HOST: configserver

      # 服務註冊中心的位址。application.yaml 寫的是
      #     defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}
      # 本機跑 → localhost，容器跑 → 這一行。
      #
      # ⚠ 整條包成一個變數，不要拆成 ${EUREKA_HOST}:${SERVER_PORT} ——
      #   SERVER_PORT 會跟 Spring 自己的 server.port 環境變數撞名，設了會連帶
      #   把 Eureka 的位址一起改掉，然後註冊一路失敗而 log 不說明原因。
      #
      # ⚠ 結尾的 /eureka/ 不能省，那是 Eureka 的 API 路徑，不是根路徑。
      EUREKA_URL: http://eurekaserver:8070/eureka/

      # application.yaml 的 import 帶著 optional:（本機單獨跑某個服務時方便），
      # 但容器裡不該容忍 —— depends_on 已保證 configserver 先 healthy，
      # 這時還連不上就是真的有問題，不該安靜地啟動成「設定全是 null」。
      # 這個開關讓 optional: 失效，連不上就 fail fast。
      SPRING_CLOUD_CONFIG_FAIL_FAST: "true"

      # ── H2 網頁管理介面（開發用）─────────────────────────────────────────
      # 用瀏覽器開 http://localhost:8080/h2-console（loan 8090、card 9000），
      # 連線資訊：
      #     JDBC URL  jdbc:h2:file:/data/accountdb   （loandb / carddb）
      #     User      SA
      #     Password  留空
      #
      # 🔑 為什麼要在容器裡開這個：H2 是檔案模式，檔案在 volume 裡（WSL2），
      #    Windows 上的 DBeaver 看不到那個路徑。Console 跑在容器內部，
      #    所以它看得到 /data —— 這是唯一能「邊跑邊看資料」的方式。
      #
      # ⚠ 兩個都要設，只設 ENABLED 會被擋掉，畫面出現：
      #       Sorry, remote connections ('webAllowOthers') are disabled on this server.
      #   原因：H2 Console 只接受「本機」連線，而你的瀏覽器在 Windows，
      #   請求經 Docker 轉發後，容器看到的來源是閘道 IP（172.18.0.1）不是 127.0.0.1。
      #   在 IntelliJ 跑時不用設第二個，因為那時瀏覽器和程式真的在同一台機器上。
      #
      # ⚠ 這兩行刻意放 compose 不放 application.yaml —— WEB_ALLOW_OTHERS 等於
      #   把沒有密碼的資料庫對外開放，只該存在於本機開發的 compose。
      SPRING_H2_CONSOLE_ENABLED: "true"
      SPRING_H2_CONSOLE_SETTINGS_WEB_ALLOW_OTHERS: "true"

    # ⚠ rabbitmq 那項嚴格說是多餘的（configserver 已經等過它，依賴會遞移），
    #   但這三個服務是「直接連」RabbitMQ 的，寫出來才誠實 —— 哪天 configserver
    #   不再需要 Bus，遞移關係消失時才不會安靜地壞掉。
    #
    # 🔑 eurekaserver 那項是「軟依賴硬寫」：Eureka 連不上服務照樣能啟動
    #    （只是背景每 30 秒重試註冊）。寫出來的好處是啟動後就是可用狀態，
    #    不會有「服務起來了但彼此還找不到對方」的空窗期。
    depends_on:
      rabbitmq:
        condition: service_healthy
      configserver:
        condition: service_healthy
      eurekaserver:
        condition: service_healthy
