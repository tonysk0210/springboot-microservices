# Eureka Server：提供服務註冊、查詢 API 與管理頁面。

server:
  port: 8070                         # Eureka 管理頁面：http://localhost:8070
spring:
  application:
    name: eurekaserver

# 單機模式：Eureka 不向自己註冊，也不下載其他 Eureka 的清單。
eureka:
  instance:
    # Compose 以 EUREKA_HOST=eurekaserver 覆寫；本機執行時使用 localhost。
    hostname: ${EUREKA_HOST:localhost}
  client:
    register-with-eureka: false      # 不註冊自己
    fetch-registry: false            # 不從其他 Eureka 取得清單
    service-url:
      # Eureka Server 的 API 位址，Client 用它註冊與查詢服務。
      # 目前是單機模式，因為 register/fetch 都是 false，所以不會主動連線。
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        # health 健康狀態；info 基本資訊；prometheus 提供 Prometheus 指標；
        # metrics 可查看單項監控指標。
        include: health,info,prometheus,metrics

  metrics:
    # 讓監控系統區分不同服務的指標。
    tags:
      application: ${spring.application.name}

  endpoint:
    health:
      # 開發環境顯示各健康檢查細節；正式環境建議改為 never。
      show-details: always

  info:
    # 讓 info.app 內容出現在 /actuator/info。
    env:
      enabled: true

# /actuator/info 顯示的基本資訊。
info:
  app:
    name: "eurekaserver"
    description: "Eureka Server App"
    version: "1.0.0"
