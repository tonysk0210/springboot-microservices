# =============================================================================
#  Eureka Server —— 服務註冊中心（電話簿）。儀表板 http://localhost:8070
#  服務啟動時來這裡登記自己，要呼叫別人時來這裡查地址。
#
#  專案 port 分配（別再撞）：
#      5672 / 15672  rabbitmq        8071  configserver     8090  loan
#      8070          eurekaserver    8072  gatewayserver    9000  card
#                                    8080  account
# =============================================================================

server:
  # ⚠ 不能省，預設 8080 會跟 account 撞。下面 defaultZone 會引用它。
  port: 8070

spring:
  application:
    name: eurekaserver

  # 本機跑 → localhost，容器跑 → configserver（由 common.yml 的 CONFIGSERVER_HOST 覆寫）。
  #
  # ⚠⚠ 不要把 server.port / eureka.* 放進 configyml/eurekaserver.yml ⚠⚠
  #   Config Server 的值贏過本檔案，等於遠端能偷改本服務的 port，而 optional:
  #   讓失敗時完全無聲。判準：「網路拓撲」屬於本檔案 + compose，「業務內容」才放遠端。
  #   eurekaserver 是純基礎設施，沒有任何設定需要遠端下發。
  config:
    import: "optional:configserver:http://${CONFIGSERVER_HOST:localhost}:8071/"

# =============================================================================
#  單機模式
#  🔑 為什麼 Eureka Server 需要一組 eureka.client.*？因為 Eureka 天生設計成叢集 ——
#     每台 Server 靠內建的 client 去跟別台互相複製名冊。只跑一台就要把它關掉。
# =============================================================================
eureka:
  instance:
    # 自報家門的名字（defaultZone 引用它，儀表板也顯示它）。
    # ⚠ 容器化時由 compose 設成服務名 EUREKA_HOST: eurekaserver ——
    #   否則客戶端拿到 localhost，而容器裡的 localhost 是容器自己。
    hostname: ${EUREKA_HOST:localhost}

  client:
    register-with-eureka: false    # 不把自己登記進名冊（預設 true，只是雜訊）
    fetch-registry: false          # 不去跟別台下載名冊（預設 true，但沒有別台）

    service-url:
      # 「別台 Eureka 在哪」，展開後就是自己。
      # 🔑 指向自己的用意：Eureka 會把清單裡「等於我自己」的濾掉 → peer 清單為空 → 不同步。
      # ⚠ 不寫這行會退回預設的 8761，那個不等於自己 → 被當成真 peer → 一直噴
      #   TransportException: Cannot execute request on any known server
      # ⚠⚠ defaultZone 必須駝峰式。寫成 default-zone「不報錯只失效」——
      #   它是 Map 的 key 不是屬性名，Spring 的寬鬆綁定管不到。
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

# /actuator/info 的內容。⚠ 還要下面的 management.info.env.enabled 才顯示得出來。
# ⚠ eurekaserver 不註冊自己，所以這份 info 不會出現在儀表板，只能手動打 /actuator/info。
info:
  app:
    name: "eurekaserver"
    description: "Eureka Server App"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        # Actuator 預設「只開 health」，其他要明確列出來。
        #   health / info / refresh / busrefresh
        # ⚠ refresh 對本服務用途很窄 —— 設定幾乎都是啟動時綁死的，
        #   真正改得動的只有 logging.level.*（遠端調 log 除錯）。
        # ⚠ 刻意不加 env（account 有）—— 它會印出所有設定值，這裡沒必要多一個曝光面。
        include: health,info,refresh,busrefresh

  endpoint:
    # 不開的話 /actuator/health 只回 {"status":"UP"}，出事時不知道是哪一項壞的。
    # 也能只查單項：/actuator/health/discoveryComposite
    # ⚠ 只適合開發環境（details 含本機路徑等內部資訊，端點沒有驗證）。
    #   正式環境用 never，或折衷 show-components: always（看得到哪項壞但不含 details）。
    health:
      show-details: always

  # 讓上面那段 info: 真的顯示出來。
  # ⚠ 沒有這行 /actuator/info 只回空的 {}，而且沒有任何錯誤或警告 ——
  #   info.* 由 env contributor 提供，而它預設是關的（Spring Boot 2.6 起的行為）。
  info:
    env:
      enabled: true

# =============================================================================
#  刻意「沒有」的設定
#    exposure.include: "*"        會連 /actuator/env、/actuator/heapdump 一起開，資安地雷
#    health.probes.enabled        K8s 的 liveness / readiness 探針，Boot 偵測到 K8s 會自動開。
#                                 現在用 Docker 自己的 healthcheck:，等走到 K8s 再補。
# =============================================================================
