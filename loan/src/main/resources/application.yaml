server:
  port: 8090

logging:
  level:
    org.hibernate.tool.schema: DEBUG                  # 啟動時「驗表」：Entity 與資料表對不對得上
    org.springframework.jdbc.datasource.init: DEBUG   # 啟動時「建表」：schema.sql 有沒有跑
    # （兩者都只涵蓋啟動階段。API 執行的 SQL 靠下面這行）

    # API 執行的 SQL。取代 spring.jpa.show-sql —— 走 logger 才有時間、執行緒、追蹤 ID。
    org.hibernate.SQL: DEBUG
  pattern:
    # 時間(綠) 等級(藍) [執行緒](紅) [服務名,correlationId,traceId,spanId](洋紅) logger名稱(黃) - 訊息
    # %X{correlationId:-} 撈 MDC 裡的追蹤 ID（CorrelationIdFilter 放進去的）。
    # 完整說明見 account 的 application.yaml。
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]) %yellow(%logger{15}) - %msg%n"

spring:
  # ⚠ 這個名字決定去 Config Server 拿哪個檔案：loan → configyml/loan.yml
  #   對不上時 Config Server 回「200 + 空設定」而不是 404，服務照常啟動但拿到 null。
  application:
    name: loan

  # 啟動時去 Config Server 抓設定，疊在本檔案之上（同名 key 遠端贏；
  # 但環境變數又贏過遠端，所以 compose 的 environment: 可以當除錯後門）。
  #
  # optional: = 抓不到也照樣啟動，退回用本檔案的值 —— 本機想單獨跑 loan 時方便。
  #
  # 位址寫成變數，本機和容器共用同一行：
  #     IntelliJ 跑（沒設變數）→ localhost
  #     容器跑（common.yml 設 CONFIGSERVER_HOST: configserver）→ configserver
  #
  # ⚠ 千萬不要改回「在 compose 用 SPRING_CONFIG_IMPORT 覆寫」——那樣不會覆寫，
  #   而是「兩個 import 都執行」。spring.config.import 跟一般屬性的規則不同：
  #   一般屬性同名 key 比優先權、高的贏；但 import 是由 ConfigData 機制逐個
  #   設定來源分別處理，yaml 一份、環境變數一份，互不相干。
  #   症狀：log 每次啟動和 refresh 都多印 localhost:8071 的 Connection refused，
  #        程式其實正常（被 optional: 忽略了），但假警報會蓋掉真警報。
  config:
    # 本機預設 optional；Compose / Kubernetes 設空字串後，Config Server 就是必要依賴。
    import: "${CONFIGSERVER_OPTIONAL_PREFIX:optional:}configserver:http://${CONFIGSERVER_HOST:localhost}:8071/"

  # RabbitMQ 連線（Spring Cloud Bus 用它廣播 refresh 事件）
  # 🔑 這四行可以全部刪掉 —— Spring Boot 預設就是 localhost/5672/guest/guest。
  #    寫出來只是讓依賴關係看得見，以及容器化時知道要改哪一行。
  # ⚠ 容器裡由 compose 覆寫：SPRING_RABBITMQ_HOST: rabbitmq
  # ⚠ RabbitMQ 沒開時服務仍會啟動，但會在背景無限重連，而且收不到 Bus 廣播。
  # ⚠ guest 只適合本機。容器間連線若出現 ACCESS_REFUSED，就是 guest 被限制
  #   只能從 loopback 連，得另建帳號。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  datasource:
    # 🔑 IntelliJ 和容器連的是「同一台 MySQL 的同一個 database」，只是路不同：
    #        IntelliJ  localhost:3306   ← 走 compose 發布出來的 port
    #        容器      mysql:3306       ← 走 compose 內部網路（服務名 = DNS 名）
    # ⚠ 刻意不寫 driverClassName —— Spring Boot 從 jdbc:mysql:// 自己推斷。
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/loandb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  jpa:
    # ⚠ 不要寫死 database-platform（例如 H2Dialect）—— Hibernate 會依實際連線
    #   自動選方言，寫死會導致換 Postgres 時用錯語法。
    hibernate:
      ddl-auto: validate   # 只驗證 Entity 與資料表是否相符，不自動改結構

    # ⚠ 刻意「不用 show-sql: true」—— 那個是 Hibernate 直接 System.out.println，
    #   完全不經過 logback，印出來的 SQL 沒有時間、沒有執行緒、也沒有追蹤 ID。
    #   改用上面 logging.level 的 org.hibernate.SQL: DEBUG。
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      # ⚠ 檔案模式的 H2 不算「內嵌資料庫」，所以預設的 embedded 不會執行，
      #   必須用 always。schema.sql 是 CREATE TABLE IF NOT EXISTS，重複執行安全。
      mode: always
      schema-locations: classpath:/sql/schema.sql

# =============================================================================
#  Eureka Client —— 向註冊中心報到
#
#  啟動時做兩件事：把自己登記上去、把整份名冊抓回本機快取。
#  之後 account / card 要呼叫 loan 就不必寫死 http://loan:8090，
#  改用服務名（= spring.application.name，儀表板上顯示成大寫 LOAN）。
#
#  儀表板：http://localhost:8070
#  ⚠⚠ loan/pom.xml 目前「還沒有」spring-cloud-starter-netflix-eureka-client ⚠⚠
#     所以這整段現在是「寫了但不生效」—— 不會註冊、也不會有任何錯誤訊息。
#     補上那個依賴之後才會開始運作。
# =============================================================================
eureka:
  instance:
    # 登記時留 IP，不留主機名。
    # 🔑 別的服務拿到這串字會直接組成 URL 去打 —— 主機名在對方那邊解析不出來就失敗，
    #    而且錯誤看起來像網路問題，不像設定問題，很難查。
    # ⚠ 容器裡登記的會是 bridge 網路的 IP（172.18.0.x）：
    #     容器 → 容器  ✅ 通
    #     Windows 瀏覽器 / Postman → 那個 IP  ❌ 不通（還是要走 localhost:8090）
    prefer-ip-address: true

  client:
    # ⚠⚠ 這一行不能省，少了它「push 之後服務會從 Eureka 上消失」⚠⚠
    #   症狀：WARN InstanceInfo - Passed in hostname is blank, not setting it
    #        → registration failure with status code 400 → 每 30 秒重試永遠失敗
    #   原因：hostname / instanceId 等欄位預設是程式碼算出來的、不來自屬性，
    #        設定一有變動就會被 ConfigurationPropertiesRebinder 清空。
    #        這個開關讓 Eureka client 整組退出 refresh 路徑。
    #   完整說明見 account 的 application.yaml。
    refresh:
      enable: false

    # 這兩個本來就預設 true，寫出來是為了跟 eurekaserver 那份（都是 false）對照。
    # 兩者完全獨立，想像成公司通訊錄：
    register-with-eureka: true    # 把我的分機登記進去（讓別人找得到我）
    fetch-registry: true          # 影印一份通訊錄回座位（讓我找得到別人）
    #
    # 🔑 fetch-registry 是「客戶端負載平衡」的地基 —— 名冊在本機有快取（預設 30 秒
    #    更新一次），所以呼叫別人時不必先問 Eureka，直接從本機名單挑一個實例打。
    #    這也是 Eureka 掛掉後服務還能撐一陣子的原因。

    service-url:
      # 容器化時由 compose 設：EUREKA_URL: http://eurekaserver:8070/eureka/
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}

# /actuator/info 的內容。Eureka 儀表板上每個實例的 status page 連結預設就指向這裡，
# 實例一多時，用來確認「這台到底是哪個服務、哪個版本」。
# ⚠ 光寫這段看不到東西，還要下面的 management.info.env.enabled: true。
info:
  app:
    name: "loan"
    description: "Bank Loan App"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        # Actuator 預設只開 health，其他端點都要明確列出來。
        #   env         看設定的來源與優先序 —— 查「值到底來自哪一層」最快的方式
        #   refresh     只重抓「這一個」服務的設定（POST）
        #   busrefresh  經 RabbitMQ 廣播，讓「所有」服務一起重抓（POST）
        #   shutdown    優雅關閉服務（POST）—— 另需下方 endpoint.shutdown.access
        #
        # ⚠ 不是所有設定 refresh 都改得動：
        #     loan.* 這類自訂設定、logging.level.*                           → 有效
        #     server.port（Tomcat 已綁定）、spring.datasource.*（連線池已建立）→ 無效，只能重啟
        #
        # ⚠ env 會印出所有設定（含連線字串），refresh 是任何人都能打的 POST。
        #   正式環境要用 Spring Security 保護，或只開在內部 port。
        #
        # 🔑 兩個都留著，除錯時可以把問題切一半：busrefresh 打了某個服務沒更新，
        #    就單獨對它打 refresh —— 有更新代表問題在 Bus（沒收到廣播），
        #    沒更新代表問題在 Config Server 那側（通常是忘記 push）。
        include: health,info,env,refresh,busrefresh,shutdown,prometheus,metrics

  # access 是 Spring Boot 3.4 起取代舊 enabled: true 的三段式層級：
  #     none          端點不存在（連 bean 都不會建）
  #     read-only     只能 GET
  #     unrestricted  POST / DELETE 也放行  ← shutdown 是 POST，非它不可
  #
  # 🔑 全部端點裡只有 shutdown 和 heapdump 預設關閉（官方文件明列的兩個例外）——
  #    一個能關掉服務，一個能把整包記憶體 dump 出來。
  #
  # 🔑 為什麼微服務特別需要它：優雅關閉會「主動通知 Eureka 註銷」，儀表板上馬上消失。
  #    直接按 IDE 停止鈕或 kill -9 的話，要等心跳超時（90 秒）再加上驅逐排程
  #    （每 60 秒掃一次）—— 中間那幾分鐘，別的服務還是會把請求送到已經死掉的實例上。
  #    這就是「優雅關閉」在微服務裡的真正價值：不是為了資料完整性，是為了不讓流量打到墓碑。
  #
  # ⚠ 這是「沒有驗證的 POST，任何人打了服務就掛掉」。正式環境要用 Spring Security
  #   保護或直接關掉（上面的 env 端點會印出所有設定值，性質相同）。
  # ⚠ 容器裡打了它 → 應用程式退出 → 容器變 Exited(0)。compose 目前沒設 restart: 政策，
  #   所以要手動 docker compose up -d 才會回來。
  #
  # 用法：Invoke-RestMethod http://localhost:8090/actuator/shutdown -Method Post
  # 每一筆指標都貼上服務名，Grafana 裡才分得出是誰的。
  # ⚠ 不加的話四個服務的 jvm_memory_used_bytes 全混在一起，圖表毫無意義。
  metrics:
    tags:
      application: ${spring.application.name}

  # ── OpenTelemetry 追蹤 ────────────────────────────────────────────────────
  # 🔑 跟手寫的 correlation-id 的差別：
  #      correlation-id  整趟只有一個值，看不出誰先誰後、各花多久
  #      traceId/spanId  每一段一個 span，帶父子關係和起訖時間 → 畫得出瀑布圖
  # ⚠ 兩套目前「並存」，等 Tempo 跑順、確認瀑布圖沒問題再考慮拆掉手寫那套。
  tracing:
    sampling:
      # 1.0 = 全部採樣。⚠ 正式環境通常 0.1（流量大時 span 量非常可觀）。
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          # span 往這裡送。⚠ Boot 4.1 把屬性改名了，舊教材寫的
          #   management.otlp.tracing.endpoint 雖然還能用，但已是相容用途。
          # 本機跑 → localhost:4318（Tempo 容器有 ports 映射）
          # 容器跑 → compose 覆寫成 http://tempo:4318/v1/traces
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # ⚠⚠ 這段不能省 —— 少了它每分鐘噴一次 404 錯誤堆疊 ⚠⚠
  #
  # spring-boot-starter-opentelemetry 順帶帶進 micrometer-registry-otlp，
  # 它預設也會把「指標」用 OTLP 送到 localhost:4318/v1/metrics。
  # 但 Tempo 只收 trace（/v1/traces），收到 /v1/metrics 直接回 404：
  #     WARN OtlpMeterRegistry - Failed to publish metrics to OTLP receiver
  #     ...Server responded with HTTP status code 404
  #
  # 🔑 而且本來就不需要 —— 指標已經由 micrometer-registry-prometheus 負責
  #    （Prometheus 主動來抓 /actuator/prometheus）。兩套並存只是重複又出錯。
  #
  # ⚠ 課程用 agent 那條路，對應的環境變數是 OTEL_METRICS_EXPORTER: none，
  #   目的一模一樣。
  otlp:
    metrics:
      export:
        enabled: false

  endpoint:
    shutdown:
      access: unrestricted

    # /actuator/health 預設只回 {"status":"UP"}，出事時完全不知道是哪一項壞了。
    # 開了之後會列出每個 HealthIndicator（db / rabbit / diskSpace / discoveryComposite…），
    # 壞掉的那一項會多一個 details.error 直接指出原因。
    # 還能只查單項：/actuator/health/db、/actuator/health/discoveryComposite
    #
    # ⚠ 只適合開發環境 —— details 裡有 GitHub repo 網址、本機絕對路徑、磁碟容量、
    #   RabbitMQ 版本等內部資訊，而這個端點是「沒有驗證就能打」的。
    #   正式環境改成 never（預設）或 when-authorized（需搭配 Spring Security）；
    #   折衷可用 show-components: always —— 看得到「是 rabbit 壞了」但不含 details。
    health:
      show-details: always

    # /actuator/env 預設把所有值遮成 ******（Spring Boot 3.0 起）。開了才看得到
    # 實際值，以及「被覆蓋掉的那一層」—— 完整說明見 account 的 application.yaml。
    # ⚠⚠ 只適合本機開發：會印出明文連線字串和密碼，而端點沒有驗證。
    env:
      show-values: ALWAYS

  # 讓上面那段 info: 真的顯示出來。
  # info.* 是由「env contributor」提供的，而它預設是關的。Spring Boot 4.1 官方文件：
  # ⚠ 沒有這行，/actuator/info 只會回空的 {}，而且不會有任何錯誤或警告。
  info:
    env:
      enabled: true
