spring:
  application:
    name: configserver

  # RabbitMQ 連線。configserver 需要 Bus 是為了「發送」—— /monitor 收到 GitHub
  # webhook 後，靠 Bus 把 refresh 事件廣播給三個服務。
  # 🔑 這四行可以刪掉（Spring Boot 預設就是 localhost/5672/guest/guest），
  #    寫出來只是讓依賴關係看得見。容器裡由 compose 覆寫 SPRING_RABBITMQ_HOST: rabbitmq。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # ⚠ 這裡刻意「完全不寫 spring.profiles」—— git 是預設後端，不用也不能靠 profile 指定。
  #   Spring Cloud 沒有名為 git 的內建 profile，寫 active: git 只是啟用一個空 profile，
  #   對後端選擇毫無影響，而且不會有任何警告。
  #   只有 native 是靠 profile 切換的（原始碼是 @Profile("native")）。
  #
  #   ---- 要切回 native 後端時，取消註解下面兩行，並取消註解最下方的 native: 區塊 ----
  #   （兩處都要，只做一半沒有效果）
  #   profiles:
  #     active: native

  cloud:
    bus:
      refresh:
        # 不讓 configserver 處理收到的 refresh 廣播 —— 它的設定來自本檔案，
        # refresh 自己毫無意義（log 只會出現 "Keys refreshed []"），卻會順帶噴一段
        # 很長的 WARN（ConfigServerHealthIndicator 沒有無參建構子，rebinder 建不出來）。
        # 🔑 只關掉「接收端」，不影響 /monitor 的「發送」—— 兩者在原始碼裡是不同的
        #    設定類別，只有接收端受這個開關控制。
        enabled: false

    config:
      server:
        git:
          # ⚠ 用 HTTPS 不要用 SSH —— 容器裡沒有你的 SSH key，會卡在認證。
          uri: https://github.com/tonysk0210/springboot-microservices

          default-label: main    # 分支名（Config Server 術語叫 label）

          # ⚠ 不設的話只會讀 repo 根目錄，configyml/account.yml 找不到 ——
          #   而且不報錯，只回空的 propertySources。
          search-paths: configyml

          # 本機 clone 變髒時強制覆蓋，避免卡在無法 pull 的狀態
          force-pull: true

          # 啟動時就 clone（預設 false = 等第一個請求才 clone）。
          # ⚠ 預設的懶惰行為很難查：uri 或 search-paths 打錯字時 configserver 會
          #   「正常啟動」，直到有服務來要設定才失敗，而你在那邊只看到拿到 null。
          #   設 true 就是 fail fast。容器化後還有第二個好處：容器變 healthy 時
          #   代表 repo 真的 clone 好了，depends_on: service_healthy 才名副其實。
          clone-on-start: true

          # 每次請求都會 git fetch（預設 refresh-rate: 0），所以 push 之後不必重啟。
          # 要減少對 GitHub 的請求：refresh-rate: 30

          # ⚠ private repo 才需要（password 填 GitHub token）。正式環境用環境變數：
          #   SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME / ..._PASSWORD
          # username: tonysk0210
          # password: ${GIT_TOKEN}

        # ---- native 後端（保留備用，目前停用）--------------------------------
        # 不需要 git repo，直接讀本機檔案。要切回來除了取消註解這段，還必須把
        # 上面的 spring.profiles.active: native 一起取消註解。
        #
        # ⚠ 取消註解時注意兩件事：
        #   1. native: 要跟 git: 同一層（8 個空格），不能縮成 git: 的子項目
        #   2. 下面兩行 search-locations「二選一」，兩行都留會是同名 key，
        #      YAML 直接解析失敗（found duplicate key search-locations）
        #
        #   classpath:/config   檔案打包進 jar → 改設定要 package + 重建 image + 重啟容器 （等於失去「改設定不用重新部署」這個核心價值，只適合最初練習）
        #   file:///磁碟路徑     存檔就生效，configserver 不用重啟
        #
        #   ⚠ 但不管哪一種，三個服務都還是要 refresh —— 客戶端只在啟動時抓一次設定，跟後端是什麼完全無關。
        #   ⚠ Windows 路徑在容器裡不存在，要用 bind mount 把主機資料夾對應進去，並改成容器內路徑：
        #        volumes: ["D:/.../configyml:/config"]
        #        search-locations: "file:///config"
        #
#         native:
#           search-locations: "classpath:/config"
#           # search-locations: "file:///D:/Fork/github/springboot-microservices/configyml"

server:
  port: 8071        # ⚠ 不能省，預設 8080 會跟 account 撞

# =============================================================================
#  設定值加密
#  金鑰不寫在這裡（本檔案會進 git），改由環境變數 ENCRYPT_KEY 提供，
#  實際值在專案根目錄的 .env。操作步驟見 .env.example。
#
#  用法：POST /encrypt 拿密文 → 貼進 configyml/*.yml 寫成 '{cipher}密文'
#        （單引號不能省）→ push。configserver 供應設定時自動解密，
#        客戶端收到明文，不需要知道金鑰、也不用改程式碼。
#  ⚠ 換金鑰的話舊密文全部解不開，沒有輪替機制。
#  ⚠ /encrypt 和 /decrypt 是公開的 POST 端點，正式環境要保護或關掉。
# -----------------------------------------------------------------------------
#  ⚠ git 後端讀的是「GitHub 上的內容」，不是磁碟上的工作目錄 ——
#    改完 configyml/*.yml 一定要 commit + push，否則端點拿到的還是舊版本。
#    這是換成 git 後最容易踩的坑：檔案明明改了，端點卻沒變。
#
#  ⚠ 專案裡有「兩份」設定檔，別改錯：
#      configyml/                              ← git 後端讀這份（目前生效）
#      configserver/src/main/resources/config/ ← native 後端讀這份（備用，不生效）
#
#  驗證：http://localhost:8071/account/default
#        propertySources[].name 顯示 GitHub URL   → git 後端 ✅
#        顯示 classpath:/config/account.yml       → 還在走 native ❌
# =============================================================================
