server:
  port: 8071

spring:
  application:
    name: configserver

  # 啟用 composite，讓 Config Server 同時讀取 Git 與 native 設定。
  profiles:
    active: composite

  cloud:
    config:
      server:
        # 依序合併 Git 與 native；同名設定以 Git 為準。
        composite:
          # 第一順位：Git
          - type: git
            uri: https://github.com/tonysk0210/springboot-microservices
            default-label: main
            # Git 設定檔所在的子目錄。
            search-paths: configyml
            # Git clone 異常時強制重新同步。
            force-pull: true
            # 啟動時立即 clone Git；若 URI、權限或分支錯誤，及早讓啟動失敗。並把 Git repository clone 到 Config Server 的暫存目錄。
            clone-on-start: true

          # 第二順位：native
          - type: native
            # 讀取打包在 Config Server 內的 native 設定檔。
            search-locations: classpath:/config

    bus:
      refresh:
        # Config Server 不需刷新自己的設定；不處理 refresh 事件，不影響 /monitor 發送 refresh 事件給其他微服務。
        enabled: false

  # RabbitMQ 供 Config Server 的 Bus 發送 refresh 事件；容器會將 host 覆寫為 rabbitmq。
  # 未設定時使用 Spring Boot 預設值：localhost、5672、guest/guest。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

management:
  endpoints:
    web:
      exposure:
        # Actuator：health 檢查服務與 Git/native backend 狀態；
        # prometheus/metrics 提供監控指標。
        # Config Server 只透過 /monitor 發送 Bus refresh，不開放 busrefresh 入口。
        # env/info 未開放，避免暴露設定內容。
        include: health,prometheus,metrics

  # 每一筆指標都貼上服務名，Grafana 裡才分得出是誰的。
  # ⚠ 不加的話四個服務的 jvm_memory_used_bytes 全混在一起，圖表毫無意義。
  metrics:
    tags:
      application: ${spring.application.name}

  endpoint:
    # /actuator/health 預設只回 {"status":"UP"}，出事時完全不知道是哪一項壞了。
    # 開了之後會列出每個 HealthIndicator，壞掉的那一項多一個 details.error 指出原因。
    # 還能只查單項：/actuator/health/configServer
    #
    # 🔑 configserver 最值得看的是「configServer」這一項 —— 它會顯示 git 後端的狀態。
    #    repo clone 失敗、uri 或 search-paths 打錯時，這裡會直接告訴你，
    #    不用等到某個服務來要設定卻拿到空的才發現。
    #
    # ⚠ 只適合開發環境 —— details 裡有 GitHub repo 網址、本機絕對路徑等內部資訊，
    #   而這個端點是「沒有驗證就能打」的。
    #   正式環境改成 never（預設）或 when-authorized（需搭配 Spring Security）；
    #   折衷可用 show-components: always —— 看得到哪一項壞了但不含 details。
    health:
      show-details: always

# =============================================================================
#  設定值加密
#  金鑰不寫在這裡（本檔案會進 git），改由環境變數 ENCRYPT_KEY 提供，
#  實際值在專案根目錄的 .env。操作步驟見 .env.example。
#
#  用法：POST /encrypt 拿密文 → 貼進 configyml/*.yml 寫成 '{cipher}密文'
#        （單引號不能省）→ push。configserver 供應設定時自動解密，
#        客戶端收到明文，不需要知道金鑰、也不用改程式碼。
#  ⚠ 換金鑰的話舊密文全部解不開，沒有輪替機制。
#  ⚠ /encrypt 和 /decrypt 是公開的 POST 端點，正式環境要保護或關掉。
# -----------------------------------------------------------------------------
#  ⚠ git 後端讀的是「GitHub 上的內容」，不是磁碟上的工作目錄 ——
#    改完 configyml/*.yml 一定要 commit + push，否則端點拿到的還是舊版本。
#    這是換成 git 後最容易踩的坑：檔案明明改了，端點卻沒變。
#
#  ⚠ 專案裡有「兩份」設定檔，別改錯：
#      configyml/                              ← git 後端讀這份（目前生效）
#      configserver/src/main/resources/config/ ← native 後端讀這份（備用，不生效）
#
#  驗證：http://localhost:8071/account/default
#        propertySources[].name 顯示 GitHub URL   → git 後端 ✅
#        顯示 classpath:/config/account.yml       → 還在走 native ❌
# =============================================================================
