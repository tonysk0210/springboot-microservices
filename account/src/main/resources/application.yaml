server:
  port: 8080

logging:
  level:
    org.hibernate.tool.schema: DEBUG                  # 啟動時「驗表」：Entity 與資料表對不對得上
    org.springframework.jdbc.datasource.init: DEBUG   # 啟動時「建表」：schema.sql 有沒有跑
    org.hibernate.SQL: DEBUG                          # Hibernate 印出 SQL（含參數）—— 方便對照資料表結構與資料
    org.apache.kafka.clients.consumer.internals.OffsetFetcherUtils: ERROR

    # Feign 呼叫的完整請求／回應。⚠ 必須是 DEBUG —— Feign 的 log 只在這個層級輸出，
    #   而且 logger 名稱是「介面所在的套件」，不是 feign.* 這種函式庫名稱。
    #   實際印什麼由下面的 spring.cloud.openfeign...loggerLevel 決定，兩個都要設。
    com.example.account.service.client: DEBUG
  pattern:
    # 時間(綠) 等級(藍) [執行緒](紅) [服務名,correlationId,traceId,spanId](洋紅) logger名稱(黃) - 訊息
    #
    # %X{correlationId:-} 撈 MDC 裡的追蹤 ID（CorrelationIdFilter 放進去的），
    # :- 是「撈不到就印空字串」，不會炸。
    # 🔑 有了這欄，同一次呼叫在 gateway / account / loan / card 的 log 可以用同一組 ID 串起來。
    #
    # ⚠ 這裡是「整條」自訂 console pattern，Spring Boot 專門給追蹤用的
    #   logging.pattern.correlation 對它無效（那個只作用在預設 pattern 上），
    #   所以必須像這樣直接寫進來。
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([${spring.application.name:},%X{correlationId:-},%X{traceId:-},%X{spanId:-}]) %yellow(%logger{15}) - %msg%n"

spring:
  application:
    name: account

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/accountdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  sql:
    init:
      mode: always
      schema-locations: classpath:/sql/schema.sql # 啟動時建表，schema.sql 只建表結構，不塞資料

  jpa:
    hibernate:
      ddl-auto: validate # 啟動時驗表，Entity 與資料表對不對得上
    properties:
      hibernate:
        format_sql: true # Hibernate 印出 SQL 時自動換行、縮排，方便對照資料表結構與資料

  # 啟動時向 Config Server 取得設定，遠端設定會覆蓋本檔案的同名值；環境變數優先權更高。
  # optional: 代表 Config Server 無法連線時仍可啟動，適合 IntelliJ 本機測試。
  # CONFIGSERVER_HOST 讓本機使用 localhost、Compose/Kubernetes 使用 configserver。
  # 不要另外用 SPRING_CONFIG_IMPORT 覆寫，否則會變成同時執行兩組 import。
  config:
    # 本機預設 optional；Compose / Kubernetes 設空字串後，Config Server 就是必要依賴。
    import: "${CONFIGSERVER_OPTIONAL_PREFIX:optional:}configserver:http://${CONFIGSERVER_HOST:localhost}:8071/"

  cloud:
    openfeign:
      client:
        config:
          # default = 套用到所有 Feign client。要只調某一個就把 default 換成 @FeignClient 的 name（loan / card）—— 這就是那個 name 的用途之一。
          default:
            # none    不印（預設）
            # basic   方法、URL、狀態碼、耗時          ← 正式環境合適
            # headers basic + 請求／回應的標頭
            # full    headers + 完整 body             ← 學習／除錯用
            #
            # ⚠ full 會把回應 body 整包印出來。正式環境要降成 basic 或 none，
            #   否則個資、金額全進 log。
            # ⚠ 只設這裡沒用，上面 logging.level 那個套件必須是 DEBUG。
            loggerLevel: full

            # 逾時。⚠ 預設值很寬鬆（連線 10 秒、讀取 60 秒），
            #   對方卡住時你的執行緒也跟著卡 60 秒，連鎖拖垮很容易發生。
            #
            # 🔑 這是「最內層」的逾時，要比 gateway 的短，整組是：
            #        本檔案 read-timeout              2s   ← 最內層
            #        gateway 的 response-timeout      5s
            #        gateway 的 timelimiter           8s   ← 最外層
            #    外層比內層短的話，account 還在等 loan、gateway 已經回 504 了，
            #    那些工作全部白做，log 上還會出現「gateway 逾時但 account 成功」的矛盾。
            #
            # ⚠ 這裡的 2 秒是「單一次」Feign 呼叫。account 要打 loan 和 card 兩次，
            #   最壞情況 2 + 2 = 4 秒，仍在 gateway 的 5 秒之內。
            connect-timeout: 1000
            read-timeout: 2000

      # 讓 Feign 呼叫交由 Spring Cloud CircuitBreaker 包裝，以套用斷路與 fallback。
      circuitbreaker:
        enabled: true

    # ⚠⚠ 這一行不能省，少了它「correlation-id 會斷在 account」⚠⚠
    #
    # ── 發生什麼事 ──────────────────────────────────────────────────────────
    # 上面開了斷路器之後，Feign 的呼叫「被搬到另一條執行緒上跑」：
    #
    #     A = http-nio-8080-exec-5   Tomcat 處理這次請求的執行緒
    #     B = pool-3-thread-3        斷路器自己的執行緒池
    #
    #     A  Controller → Service → 查 DB          都在 A
    #     B      └─ 打 loan / card                 只有這段跑到 B
    #     A  組回應、跑 fallback                    回到 A
    #
    # correlation-id 放在 MDC，而 MDC 是「每條執行緒各一份」，不會跟著工作走。
    # 所以 B 拿到的是空的：
    #     [http-nio-8080-exec-5] [account,aaea4764-...]   ← A，有 ID
    #     [pool-3-thread-3]      [account,]               ← B，沒 ID
    #
    # 更麻煩的是 FeignInterceptorConfig 也在 B 上執行 —— 它從 MDC 撈 ID 來加標頭，
    # 撈到 null 就不加，所以 loan / card 收到的請求「沒有 myBank-correlation-id」，
    # 追蹤鏈直接斷在 account。而且完全不會報錯。
    #
    # ── 為什麼要換執行緒 ────────────────────────────────────────────────────
    # 為了 TimeLimiter（超時強制中斷）。一條執行緒卡在等網路時就什麼都做不了，
    # 包括「數秒數、時間到就放棄」—— 你不能一邊睡覺一邊叫自己起床。
    # 所以要兩個人：B 去打 HTTP，A 在旁邊計時，時間到由 A 喊停 B。
    #
    # ── 這行做什麼 ──────────────────────────────────────────────────────────
    # 不要那條執行緒池了，工作就在 A 上做完 → MDC 保住。
    # ⚠ 副作用：TimeLimiter 失效（原始碼裡它只在「有執行緒池」的分支才套用）。
    #   但 Feign 自己的 connect-timeout / read-timeout（上面 2 秒 / 5 秒）本來就
    #   會擋住卡住的 HTTP 呼叫，而且分得出「連不上」和「回得慢」，更精準。
    #
    # ⚠ 只關 TimeLimiter（disable-time-limiter）沒有用 —— 原始碼的分支條件是
    #   「executorService 是不是 null」，跟 TimeLimiter 無關，照樣換執行緒。
    #
    # ── 另一種解法（本專案不採用）────────────────────────────────────────────
    # 保留執行緒池，改用 Customizer 換掉工廠的 ExecutorService
    #（configureExecutorService），自己包一層在提交時複製 MDC 過去。
    # ⚠ 不能用 Resilience4j 的 ContextPropagator —— 那個只對它自家的
    #   ThreadPoolBulkhead 生效，這裡用的是普通的 Executors.newCachedThreadPool()。
    # 要多寫幾十行來換一個 Feign 已經有的功能，不划算。
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true

    # ── 非同步通知（寄信 / 發簡訊）─────────────────────────────────────────
    function:
      # 填了 Spring 才會啟用這個 @Bean 去監聽訊息 —— 不填的話 bean 存在但沒人觸發。
      # ⚠ 將來要加第二個函式的話用「分號」隔開（a;b），不是逗號 ——
      #   逗號是「組合成一個複合函式」的意思，寫錯會找不到函式而靜靜失效。
      definition: accountReceiveCommunication;accountReceiveKafkaCommunication
    stream:
      # ⚠⚠ 有兩個 binder 時這一行不能省。
      #   Spring Cloud Bus 也走 Stream，但它的 binding（springCloudBusInput/Output）
      #   沒有寫在下面 → 會去吃「預設 binder」。只有一個 binder 時 Spring 自動選那個；
      #   兩個時就不知道該選誰，啟動失敗而且錯誤訊息不會提到 Bus。
      default-binder: rabbit1

      # 🔑 Kafka 和 RabbitMQ 的連線設定都寫在下面 spring.kafka / spring.rabbitmq
      #    ——「同一層、同一種風格」。這裡只負責取名字和指定型別。
      binders:
        rabbit1:
          type: rabbit
        kafka1:
          type: kafka

      bindings:
        # ── RabbitMQ：通知流程（指令，處理完就消失）────────────────────────
        accountSendCommunication-out-0: # 沒有函式，由 streamBridge.send 自己取
          destination: send-communication
          binder: rabbit1
        accountReceiveCommunication-in-0: # 名字 = 上面的 definition + -in-0，有函式（email|sms）改不得
          destination: communication-sent
          binder: rabbit1
          group: ${spring.application.name} # queue 取固定名字 → 多台不重複、停機不掉訊息

        # ── Kafka：事件紀錄（完整往返，topic 內仍留著可重播）──────────────────
        # 🔑 刻意跟上面送「一模一樣的內容」到不同 broker，就是為了對照差異：
        #      RabbitMQ 那則 → messageservice 消費掉 → 消失
        #      Kafka 那則    → 留在 topic 裡，offset 倒回去就能重讀
        # ⚠ 沒有設 key，所以訊息會平均散到各 partition、沒有順序保證。
        #   要「同一個帳號照順序」得加 producer.partition-key-expression。
        #
        # 🔑 messageservice 會用自己的 consumer group 讀 kafka-send-communication，處理後
        #    再送 kafka-communication-sent；account 以另一個 group 讀回傳事件。
        #    要親眼看內容就從 CLI 讀（--from-beginning 會把歷史全部倒出來，
        #    而且讀完訊息還留在 topic 裡，可以重複讀到爛）：
        #      docker exec kafka-ms /opt/kafka/bin/kafka-console-consumer.sh \
        #        --bootstrap-server localhost:9092 --topic kafka-send-communication --from-beginning
        #    ⚠ 容器內部要用 9092（INTERNAL listener）；從主機的工具連才是 29092。
        accountSendKafkaCommunication-out-0:
          destination: kafka-send-communication
          binder: kafka1
        accountReceiveKafkaCommunication-in-0:
          destination: kafka-communication-sent
          binder: kafka1
          group: ${spring.application.name}-kafka

  # RabbitMQ 連線（Spring Cloud Bus 用它廣播 refresh 事件）
  # 🔑 這四行可以全部刪掉 —— Spring Boot 預設就是 localhost/5672/guest/guest。
  #    寫出來只是讓依賴關係看得見，以及容器化時知道要改哪一行。
  # ⚠ 容器裡由 compose 覆寫：SPRING_RABBITMQ_HOST: rabbitmq
  # ⚠ RabbitMQ 沒開時服務仍會啟動，但會在背景無限重連，而且收不到 Bus 廣播。
  # ⚠ guest 只適合本機。容器間連線若出現 ACCESS_REFUSED，就是 guest 被限制
  #   只能從 loopback 連，得另建帳號。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Kafka 連線（account-events 這個事件 topic 用它）
  # 🔑 刻意跟上面 rabbitmq 放同一層 —— 兩個 broker 的「位址設定」就該長得一樣。
  #    Kafka 只有一行是因為它把主機、埠都塞進一個清單（a:9092,b:9092），
  #    而且沒有 username/password 這種欄位（要認證是走 security.protocol + sasl.*）。
  #
  # ⚠ Kafka 跟 MySQL 不同，本機和容器「不能」共用同一個位址 ——
  #   broker 會把自己的位址回報給客戶端，叫它改連過去。
  #   所以 compose 開了兩個 listener，這裡各連各的：
  #       本機 → localhost:29092（EXTERNAL）← 就是下面寫死的這個值
  #       容器 → kafka:9092（INTERNAL）    ← compose 設 SPRING_KAFKA_BOOTSTRAP_SERVERS 覆寫
  #
  # 🔑 這裡「刻意寫死」，不用 ${KAFKA_BOOTSTRAP_SERVERS:...} 這種佔位符 ——
  #    bootstrap-servers 是標準的 Boot 屬性，環境變數形式
  #    SPRING_KAFKA_BOOTSTRAP_SERVERS 本來就蓋得掉它（實測 2026-08-19：設成
  #    127.0.0.1:29092，log 印的就是 127.0.0.1:29092），佔位符只是多繞一圈。
  #    判準：值是「整個屬性」→ 寫死 + 標準環境變數；值只是「字串的一小段」
  #    → 才需要佔位符（例如上面的 spring.config.import，位址插在 URL 中間）。
  #
  # ⚠⚠ 這一行「不能」搬進 spring.cloud.stream.binders.kafka1.environment ⚠⚠
  #   同一個屬性，寫在這裡（頂層）通，塞進那個 environment 區塊就不通 ——
  #   兩種寫法都實測過（2026-08-19）。所以問題從來不是「寫在哪一層」，是「別放進 environment」。
  #
  #   放錯的症狀（很難認）：服務「照樣啟動成功」，只是每 30 秒噴一次 ——
  #       o.a.k.c.a.i.AdminMetadataManager - Metadata update failed
  #       TimeoutException: The AdminClient thread has exited. Call: fetchMetadata
  #       BindingService - Failed to create producer binding; retrying in 30 seconds
  #       ProvisioningException: Provisioning exception encountered for account-events
  #       Caused by: java.util.concurrent.TimeoutException     ← listTopics() 等 30 秒
  #   /actuator/health 也只顯示 kafka1 是 UNKNOWN（No bindings found），像雜訊；
  #   但 accountSendEvent-out-0 從頭到尾沒建起來，事件一則都送不出去。
  #
  #   🔑 怎麼一眼確認位址對不對：開戶時 log 裡 AdminClientConfig 那段的
  #      bootstrap.servers 要是 29092。印出 9092 就是這一行沒被讀到 ——
  #      因為「沒設」的預設值剛好是 localhost:9092，跟「設錯」的症狀一模一樣。
  #
  # 另一種寫法（本專案不採用）：spring.cloud.stream.kafka.binder.brokers
  #   那是 Kafka binder 自己的屬性，優先權比這一行高。要連兩個不同的 Kafka
  #   叢集時才需要它（可以每個 binder 各指一個），單一叢集用這行就好。
  kafka:
    bootstrap-servers: localhost:29092




# =============================================================================
#  Eureka Client —— 向註冊中心報到
#
#  啟動時做兩件事：把自己登記上去、把整份名冊抓回本機快取。
#  之後 loan / card 要呼叫 account 就不必寫死 http://account:8080，
#  改用服務名（= spring.application.name，儀表板上顯示成大寫 ACCOUNT）。
#
#  儀表板：http://localhost:8070
#  ⚠ 需要 pom.xml 的 spring-cloud-starter-netflix-eureka-client（已加）。
#    少了它，這整段會被安靜忽略，不報錯。
# =============================================================================
eureka:
  instance:
    # 登記時留 IP，不留主機名。
    # 🔑 別的服務拿到這串字會直接組成 URL 去打 —— 主機名在對方那邊解析不出來就失敗，
    #    而且錯誤看起來像網路問題，不像設定問題，很難查。
    # ⚠ 容器裡登記的會是 bridge 網路的 IP（172.18.0.x）：
    #     容器 → 容器  ✅ 通
    #     Windows 瀏覽器 / Postman → 那個 IP  ❌ 不通（還是要走 localhost:8080）
    prefer-ip-address: true

  client:
    # ⚠⚠ 這一行不能省，少了它「push 之後服務會從 Eureka 上消失」⚠⚠
    #
    # 症狀（實測 2026-08-05 01:02，card 的 log）：
    #     RefreshListener - Received remote refresh request.      ← push 觸發的廣播
    #     Shutting down DiscoveryClient ... deregister status: 200 ← 舊的乾淨註銷
    #     WARN InstanceInfo - Passed in hostname is blank, not setting it   ← 元凶
    #     registration failure with status code 400                ← Eureka 拒收沒有 hostname 的實例
    #     （之後每 30 秒重試一次，永遠 400，直到重啟 JVM）
    #
    # 🔑 原因：eureka.instance / eureka.client 的設定物件是 @ConfigurationProperties，
    #    而 hostname、ipAddress、instanceId 這些欄位預設是「在 @Bean 方法裡用 InetUtils
    #    算出來」的，不來自任何屬性。
    #        push → Config Server 內容變 → 屬性真的有變動 → EnvironmentChangeEvent
    #        → ConfigurationPropertiesRebinder 重新綁定整個 bean
    #        → 只從屬性重建 → 那些「算出來的」欄位全變 null/空
    #        → 心跳與註冊都失敗 → 被 Eureka 驅逐 → Gateway 回 503
    #
    # 這個開關讓 Eureka client「整組退出 refresh 路徑」，就不會被 rebind 破壞。
    # 官方描述：If disabled none of the Eureka client properties will be refreshable.
    # ⚠ 代價：改 eureka.* 設定要重啟才生效 —— 但那些本來就是啟動時綁死的
    #   （server.port、hostname、service-url 都不可能熱更新），實質上沒有損失。
    #
    # ⚠ 只有「設定真的改變」才會踩到。打 /actuator/refresh 若回傳 []（沒有 key 變動）
    #   不會發 EnvironmentChangeEvent，也就不會 rebind —— 所以那樣測不出問題，
    #   一定要 push 一個會改到 Config Server 內容的 commit 才驗得出來。
    refresh:
      enable: false

    # 這兩個本來就預設 true，寫出來是為了跟 eurekaserver 那份（都是 false）對照。
    # 兩者完全獨立，想像成公司通訊錄：
    register-with-eureka: true    # 把我的分機登記進去（讓別人找得到我）
    fetch-registry: true          # 影印一份通訊錄回座位（讓我找得到別人）
    #
    # 🔑 fetch-registry 是「客戶端負載平衡」的地基 —— 名冊在本機有快取（預設 30 秒
    #    更新一次），所以呼叫別人時不必先問 Eureka，直接從本機名單挑一個實例打。
    #    這也是 Eureka 掛掉後服務還能撐一陣子的原因。

    service-url:
      # 容器化時由 compose 設：EUREKA_URL: http://eurekaserver:8070/eureka/
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}

# /actuator/info 的內容。Eureka 儀表板上每個實例的 status page 連結預設就指向這裡，
# 實例一多時，用來確認「這台到底是哪個服務、哪個版本」。
# ⚠ 光寫這段看不到東西，還要下面的 management.info.env.enabled: true。
info:
  app:
    name: "account"
    description: "Bank Account App"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        # Actuator 預設只開 health，其他端點都要明確列出來。
        #   env         看設定的來源與優先序 —— 查「值到底來自哪一層」最快的方式
        #   refresh     只重抓「這一個」服務的設定（POST）
        #   busrefresh  經 RabbitMQ 廣播，讓「所有」服務一起重抓（POST）
        #   shutdown    優雅關閉服務（POST）—— 另需下方 endpoint.shutdown.access
        #
        # ⚠ 不是所有設定 refresh 都改得動：
        #     account.* 這類自訂設定、logging.level.*                        → 有效
        #     server.port（Tomcat 已綁定）、spring.datasource.*（連線池已建立）→ 無效，只能重啟
        #
        # ⚠ env 會印出所有設定（含連線字串），refresh 是任何人都能打的 POST。
        #   正式環境要用 Spring Security 保護，或只開在內部 port。
        #
        # 🔑 兩個都留著，除錯時可以把問題切一半：busrefresh 打了某個服務沒更新，
        #    就單獨對它打 refresh —— 有更新代表問題在 Bus（沒收到廣播），
        #    沒更新代表問題在 Config Server 那側（通常是忘記 push）。
        #
        # circuitbreakers       看 account → loan / card 兩個斷路器的狀態
        # circuitbreakerevents  看每次呼叫的成敗與狀態轉換
        # 🔑 這裡看到的跟 gateway 的是「不同的斷路器」——
        #    gateway 那組監視 gateway → account，這組監視 account → loan / card。
        #    loan 掛掉時只有這組會出現 ERROR，gateway 那組照樣是 SUCCESS
        #    （因為 account 有正常回應 200）。
        include: health,info,env,refresh,busrefresh,shutdown,circuitbreakers,circuitbreakerevents,prometheus,metrics

  # 每一筆指標都貼上服務名，Grafana 裡才分得出是誰的。
  # ⚠ 不加的話四個服務的 jvm_memory_used_bytes 全混在一起，圖表毫無意義。
  metrics:
    tags:
      application: ${spring.application.name}

  # ── OpenTelemetry 追蹤 ────────────────────────────────────────────────────
  # 🔑 跟手寫的 correlation-id 的差別：
  #      correlation-id  整趟只有一個值，看不出誰先誰後、各花多久
  #      traceId/spanId  每一段一個 span，帶父子關係和起訖時間 → 畫得出瀑布圖
  # ⚠ 兩套目前「並存」，等 Tempo 跑順、確認瀑布圖沒問題再考慮拆掉手寫那套。
  tracing:
    sampling:
      # 1.0 = 全部採樣。⚠ 正式環境通常 0.1（流量大時 span 量非常可觀）。
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          # span 往這裡送。⚠ Boot 4.1 把屬性改名了，舊教材寫的
          #   management.otlp.tracing.endpoint 雖然還能用，但已是相容用途。
          # 本機跑 → localhost:4318（Tempo 容器有 ports 映射）
          # 容器跑 → compose 覆寫成 http://tempo:4318/v1/traces
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # ⚠⚠ 這段不能省 —— 少了它每分鐘噴一次 404 錯誤堆疊 ⚠⚠
  #
  # spring-boot-starter-opentelemetry 順帶帶進 micrometer-registry-otlp，
  # 它預設也會把「指標」用 OTLP 送到 localhost:4318/v1/metrics。
  # 但 Tempo 只收 trace（/v1/traces），收到 /v1/metrics 直接回 404：
  #     WARN OtlpMeterRegistry - Failed to publish metrics to OTLP receiver
  #     ...Server responded with HTTP status code 404
  #
  # 🔑 而且本來就不需要 —— 指標已經由 micrometer-registry-prometheus 負責
  #    （Prometheus 主動來抓 /actuator/prometheus）。兩套並存只是重複又出錯。
  #
  # ⚠ 課程用 agent 那條路，對應的環境變數是 OTEL_METRICS_EXPORTER: none，
  #   目的一模一樣。
  otlp:
    metrics:
      export:
        enabled: false

  # 把斷路器狀態併進 /actuator/health（預設是關的）。
  health:
    circuitbreakers:
      enabled: true

  # access 是 Spring Boot 3.4 起取代舊 enabled: true 的三段式層級：
  #     none          端點不存在（連 bean 都不會建）
  #     read-only     只能 GET
  #     unrestricted  POST / DELETE 也放行  ← shutdown 是 POST，非它不可
  #
  # 🔑 全部端點裡只有 shutdown 和 heapdump 預設關閉（官方文件明列的兩個例外）——
  #    一個能關掉服務，一個能把整包記憶體 dump 出來。
  #
  # 🔑 為什麼微服務特別需要它：優雅關閉會「主動通知 Eureka 註銷」，儀表板上馬上消失。
  #    直接按 IDE 停止鈕或 kill -9 的話，要等心跳超時（90 秒）再加上驅逐排程
  #    （每 60 秒掃一次）—— 中間那幾分鐘，別的服務還是會把請求送到已經死掉的實例上。
  #    這就是「優雅關閉」在微服務裡的真正價值：不是為了資料完整性，是為了不讓流量打到墓碑。
  #
  # ⚠ 這是「沒有驗證的 POST，任何人打了服務就掛掉」。正式環境要用 Spring Security
  #   保護或直接關掉（上面的 env 端點會印出所有設定值，性質相同）。
  # ⚠ 容器裡打了它 → 應用程式退出 → 容器變 Exited(0)。compose 目前沒設 restart: 政策，
  #   所以要手動 docker compose up -d 才會回來。
  #
  # 用法：Invoke-RestMethod http://localhost:8080/actuator/shutdown -Method Post
  endpoint:
    shutdown:
      access: unrestricted

    # /actuator/health 預設只回 {"status":"UP"}，出事時完全不知道是哪一項壞了。
    # 開了之後會列出每個 HealthIndicator（db / rabbit / diskSpace / discoveryComposite…），
    # 壞掉的那一項會多一個 details.error 直接指出原因。
    # 還能只查單項：/actuator/health/db、/actuator/health/discoveryComposite
    #
    # 🔑 discoveryComposite 特別有用 —— 它顯示「本服務自己看到的 Eureka 名冊」：
    #        "applications": { "ACCOUNT": 1, "LOAN": 1, "CARD": 1 }
    #    比開儀表板快，而且能分辨「Eureka 上沒有」和「我的本機快取還沒更新」。
    #
    # ⚠ 只適合開發環境 —— details 裡有 GitHub repo 網址、本機絕對路徑、磁碟容量、
    #   RabbitMQ 版本等內部資訊，而這個端點是「沒有驗證就能打」的。
    #   正式環境改成 never（預設）或 when-authorized（需搭配 Spring Security）；
    #   折衷可用 show-components: always —— 看得到「是 rabbit 壞了」但不含 details。
    health:
      show-details: always

    # /actuator/env 預設把「所有」值遮成 ****** （Spring Boot 3.0 起的行為 ——
    # 它分不清哪個是機密，所以一律遮）。只看得到「值來自哪一層」，看不到值本身。
    #
    # 🔑 開了之後才能看到「被覆蓋掉的值」，這是 env 最有用的地方：
    #       spring.rabbitmq.host
    #         systemEnvironment   value=rabbitmq    ← compose 設的（贏）
    #         application.yaml    value=localhost   ← 被蓋掉的，照樣列出來
    #    容器裡 compose 的 environment 落在 systemEnvironment 那層，
    #    優先權比 Config Server 高 —— 這也是為什麼它能當除錯後門。
    #
    # ⚠⚠ 只適合本機開發 ⚠⚠
    #   開了會印出明文的資料庫連線字串、解密後的 email、RabbitMQ 密碼，
    #   而這個端點沒有任何驗證。正式環境改成 NEVER（預設）——
    #   或連 env 一起從上面的 exposure.include 移除（它是那份清單裡唯一
    #   「沒有任何元件依賴」的端點，拿掉不影響系統行為）。
    #   WHEN_AUTHORIZED 要搭配 Spring Security 才有意義，沒裝等於 NEVER。
    env:
      show-values: ALWAYS

  # 讓上面那段 info: 真的顯示出來。
  # info.* 是由「env contributor」提供的，而它預設是關的。Spring Boot 4.1 官方文件：
  # ⚠ 沒有這行，/actuator/info 只會回空的 {}，而且不會有任何錯誤或警告。
  info:
    env:
      enabled: true

# Resilience4j Circuit Breaker 的共用預設設定。
# CLOSED：正常放行並統計結果；失敗率達門檻後轉為 OPEN，暫時拒絕請求；
# OPEN 等待指定時間後轉為 HALF_OPEN，以少量試探請求判斷下游是否恢復。
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10                    # 以最近 10 次呼叫作為失敗率統計視窗
      permittedNumberOfCallsInHalfOpenState: 2 # HALF_OPEN 狀態最多放行 2 次試探呼叫
      failureRateThreshold: 50                 # 統計視窗內失敗率達 50% 時切換為 OPEN
      waitDurationInOpenState: 10000           # OPEN 維持 10 秒（10000 ms）後進入 HALF_OPEN

resilience4j.retry:
  configs:
    default:
      maxAttempts: 4
      waitDuration: 100
      enableExponentialBackoff: true       # 100 → 200 → 400
      exponentialBackoffMultiplier: 2
      exponentialMaxWaitDuration: 1s
      ignoreExceptions: # 這些「絕對不重試」
        - com.example.account.exception.ResourceNotFoundException
        - com.example.account.exception.CustomerAlreadyExistsException

# 限流：每個「時間窗」內最多放行幾次，超過就拋 RequestNotPermitted 走 fallback。
#
# ⚠ 跟 gateway 的 requestRateLimiter 是兩套不同的東西：
#       gateway   令牌桶 + KeyResolver 分人，計數存 Redis（多台共用）
#       這裡      固定時間窗、不分人，計數在記憶體（多台各算各的）
resilience4j.ratelimiter:
  configs:
    default:
      limitForPeriod: 1            # 每個時間窗放行 1 次
      limitRefreshPeriod: 5s       # 時間窗長度 —— 每 5 秒重新給 1 次額度
      timeoutDuration: 0           # 額度用完「不等待」，立刻失敗走 fallback
      #                              ⚠ 設成 1s 的話會先卡著等額度，等不到才失敗。
      #                                對使用者是多等 1 秒，對執行緒是被佔住 1 秒。
