server:
  port: 8080

logging:
  level:
    org.hibernate.tool.schema: DEBUG                  # 啟動時「驗表」：Entity 與資料表對不對得上
    org.springframework.jdbc.datasource.init: DEBUG   # 啟動時「建表」：schema.sql 有沒有跑
    org.hibernate.SQL: DEBUG                          # Hibernate 印出 SQL（含參數）—— 方便對照資料表結構與資料
    # 只對 Feign Client 套件開啟 DEBUG；實際記錄內容由 loggerLevel 決定。
    com.example.account.service.client: DEBUG
  pattern:
    # Console log 格式：時間、等級、執行緒、服務名、correlation ID、traceId、spanId、logger 與訊息。 %X{...} 從 MDC 讀取追蹤 ID；沒有值時留白。
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([${spring.application.name:},%X{X-Gateway-Correlation-Id:-},%X{traceId:-},%X{spanId:-}]) %yellow(%logger{15}) - %msg%n"

spring:
  application:
    name: account

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/accountdb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  sql:
    init:
      mode: always
      schema-locations: classpath:/sql/schema.sql # 啟動時建表，schema.sql 只建表結構，不塞資料

  jpa:
    hibernate:
      ddl-auto: validate # 啟動時驗表，Entity 與資料表對不對得上
    properties:
      hibernate:
        format_sql: true # Hibernate 印出 SQL 時自動換行、縮排，方便對照資料表結構與資料

  # 啟動時向 Config Server 取得設定，遠端設定會覆蓋本檔案的同名值；環境變數優先權更高。
  # optional: 代表 Config Server 無法連線時仍可啟動，適合 IntelliJ 本機測試。
  # CONFIGSERVER_HOST 讓本機使用 localhost、Compose/Kubernetes 使用 configserver。
  # 不要另外用 SPRING_CONFIG_IMPORT 覆寫，否則會變成同時執行兩組 import。
  config:
    # 本機預設 optional；Compose / Kubernetes 設空字串後，Config Server 就是必要依賴。
    import: "${CONFIGSERVER_OPTIONAL_PREFIX:optional:}configserver:http://${CONFIGSERVER_HOST:localhost}:8071/"

  # RabbitMQ 供 Spring Cloud Bus 廣播 refresh；本機使用 localhost，容器由 Compose 改為 rabbitmq。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  cloud:
    openfeign:
      client:
        config:
          # default 套用到所有 Feign Client；也可用 @FeignClient 的 name 個別設定。
          default:
            # basic 記錄方法、URL、狀態碼與耗時；正式環境避免使用 full，以免請求內容或敏感資料寫入 log。
            loggerLevel: basic

            # 本專案停用 Resilience4j 的 Feign 執行緒池後，TimeLimiter 無法可靠中斷
            # 阻塞中的同步 Feign；因此由這兩個 Feign timeout 作為等待時間的替代保護。
            # 連線最多 1 秒、連線後等待回應最多 2 秒；這些時間也會消耗 Gateway 的 7 秒等待時間。
            connect-timeout: 1000
            read-timeout: 2000

      # 將 Feign 呼叫交由 Spring Cloud CircuitBreaker 處理，啟用斷路器與 fallback。
      circuitbreaker:
        enabled: true

    # Spring Cloud CircuitBreaker 整合 Resilience4j 時，預設會使用獨立執行緒執行同步 Feign，主要是為了支援 TimeLimiter 的逾時控制。
    # 但執行緒切換後 MDC 不會自動傳遞，可能導致 correlation-id 遺失。
    # 本專案因此停用該執行緒池，讓 Feign 留在目前請求的執行緒執行；等待時間改由 Feign 的 connect-timeout／read-timeout 控制。
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true

    # ── 非同步通知（寄信 / 發簡訊）─────────────────────────────────────────
    function:
      # 指定要啟用並綁定的訊息函式；名稱是 Function Bean name（通常就是 @Bean 方法名）。
      definition: accountReceiveCommunication;accountReceiveKafkaCommunication
    stream:
      # 兩個 binder 並存時，沒有明寫 binder 的基礎設施 binding 預設走 RabbitMQ。
      defaultBinder: rabbit1
      binders:
        rabbit1:
          type: rabbit
        kafka1:
          type: kafka

      bindings:
        # Spring Cloud Bus 固定使用 RabbitMQ；業務事件仍可另外使用 Kafka。
        springCloudBusInput:
          binder: rabbit1
        springCloudBusOutput:
          binder: rabbit1

        # RabbitMQ：queue → account → exchange
        accountSendCommunication-out-0: # Account 發送通知工作的輸出 binding，由 StreamBridge 使用
          binder: rabbit1
          destination: send-communication
        accountReceiveCommunication-in-0: # Account 接收通知完成結果的輸入 binding
          binder: rabbit1
          destination: communication-sent
          group: ${spring.application.name} # 固定 Queue 群組，多個 Account instance 共用且避免重複處理

        # ── Kafka：事件紀錄（完整往返，topic 內仍留著可重播）──────────────────
        # 🔑 刻意跟上面送「一模一樣的內容」到不同 broker，就是為了對照差異：
        #      RabbitMQ 那則 → messageservice 消費掉 → 消失
        #      Kafka 那則    → 留在 topic 裡，offset 倒回去就能重讀
        # ⚠ 沒有設 key，所以訊息會平均散到各 partition、沒有順序保證。
        #   要「同一個帳號照順序」得加 producer.partition-key-expression。
        #
        # 🔑 messageservice 會用自己的 consumer group 讀 kafka-send-communication，處理後
        #    再送 kafka-communication-sent；account 以另一個 group 讀回傳事件。
        #    要親眼看內容就從 CLI 讀（--from-beginning 會把歷史全部倒出來，
        #    而且讀完訊息還留在 topic 裡，可以重複讀到爛）：
        #      docker exec kafka-ms /opt/kafka/bin/kafka-console-consumer.sh \
        #        --bootstrap-server localhost:9092 --topic kafka-send-communication --from-beginning
        #    ⚠ 容器內部要用 9092（INTERNAL listener）；從主機的工具連才是 29092。
        accountSendKafkaCommunication-out-0:
          destination: kafka-send-communication
          binder: kafka1
        accountReceiveKafkaCommunication-in-0:
          destination: kafka-communication-sent
          binder: kafka1
          group: ${spring.application.name}-kafka



  # Kafka 連線（account-events 這個事件 topic 用它）
  # 🔑 刻意跟上面 rabbitmq 放同一層 —— 兩個 broker 的「位址設定」就該長得一樣。
  #    Kafka 只有一行是因為它把主機、埠都塞進一個清單（a:9092,b:9092），
  #    而且沒有 username/password 這種欄位（要認證是走 security.protocol + sasl.*）。
  #
  # ⚠ Kafka 跟 MySQL 不同，本機和容器「不能」共用同一個位址 ——
  #   broker 會把自己的位址回報給客戶端，叫它改連過去。
  #   所以 compose 開了兩個 listener，這裡各連各的：
  #       本機 → localhost:29092（EXTERNAL）← 就是下面寫死的這個值
  #       容器 → kafka:9092（INTERNAL）    ← compose 設 SPRING_KAFKA_BOOTSTRAP_SERVERS 覆寫
  #
  # 🔑 這裡「刻意寫死」，不用 ${KAFKA_BOOTSTRAP_SERVERS:...} 這種佔位符 ——
  #    bootstrap-servers 是標準的 Boot 屬性，環境變數形式
  #    SPRING_KAFKA_BOOTSTRAP_SERVERS 本來就蓋得掉它（實測 2026-08-19：設成
  #    127.0.0.1:29092，log 印的就是 127.0.0.1:29092），佔位符只是多繞一圈。
  #    判準：值是「整個屬性」→ 寫死 + 標準環境變數；值只是「字串的一小段」
  #    → 才需要佔位符（例如上面的 spring.config.import，位址插在 URL 中間）。
  #
  # ⚠⚠ 這一行「不能」搬進 spring.cloud.stream.binders.kafka1.environment ⚠⚠
  #   同一個屬性，寫在這裡（頂層）通，塞進那個 environment 區塊就不通 ——
  #   兩種寫法都實測過（2026-08-19）。所以問題從來不是「寫在哪一層」，是「別放進 environment」。
  #
  #   放錯的症狀（很難認）：服務「照樣啟動成功」，只是每 30 秒噴一次 ——
  #       o.a.k.c.a.i.AdminMetadataManager - Metadata update failed
  #       TimeoutException: The AdminClient thread has exited. Call: fetchMetadata
  #       BindingService - Failed to create producer binding; retrying in 30 seconds
  #       ProvisioningException: Provisioning exception encountered for account-events
  #       Caused by: java.util.concurrent.TimeoutException     ← listTopics() 等 30 秒
  #   /actuator/health 也只顯示 kafka1 是 UNKNOWN（No bindings found），像雜訊；
  #   但 accountSendEvent-out-0 從頭到尾沒建起來，事件一則都送不出去。
  #
  #   🔑 怎麼一眼確認位址對不對：開戶時 log 裡 AdminClientConfig 那段的
  #      bootstrap.servers 要是 29092。印出 9092 就是這一行沒被讀到 ——
  #      因為「沒設」的預設值剛好是 localhost:9092，跟「設錯」的症狀一模一樣。
  #
  # 另一種寫法（本專案不採用）：spring.cloud.stream.kafka.binder.brokers
  #   那是 Kafka binder 自己的屬性，優先權比這一行高。要連兩個不同的 Kafka
  #   叢集時才需要它（可以每個 binder 各指一個），單一叢集用這行就好。
  kafka:
    bootstrap-servers: localhost:29092

# Eureka Client：向 Eureka 註冊自己，並快取其他服務的清單。
# 需要 pom.xml 的 spring-cloud-starter-netflix-eureka-client。
eureka:
  instance:
    # 註冊實例的 IP，讓其他服務可以連線。只影響 Eureka 服務發現取得的實例位址
    prefer-ip-address: true
  client:
    refresh:
      # 停用 Eureka 設定的動態 refresh，避免重新綁定時破壞註冊資料。修改 eureka.* 設定後需重新啟動服務。
      enable: false
    register-with-eureka: true    # 將自己註冊到 Eureka
    fetch-registry: true          # 取得並定期更新服務清單
    service-url:
      # Compose 使用 eurekaserver；本機預設使用 localhost。
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}

# /actuator/info（Eureka status page 預設連結）；需啟用 management.info.env.enabled 才會顯示。
info:
  app:
    name: "account"
    description: "Bank Account App"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        # Actuator 端點：health 健康狀態；info 基本資訊；env 查看設定來源。
        # refresh 只更新本服務；busrefresh 經 RabbitMQ 通知所有 Bus 服務；shutdown 優雅關閉。
        # circuitbreakers/circuitbreakerevents 查看 account → loan/card 的斷路器；
        # prometheus/metrics 提供監控指標。
        #
        # refresh 只適合可動態重綁定的設定；server.port、已建立的資料庫連線通常需重啟。
        # env、refresh、busrefresh、shutdown 可能暴露資訊或改變服務狀態，正式環境應加以保護。
        include: health,info,env,refresh,busrefresh,shutdown,circuitbreakers,circuitbreakerevents,prometheus,metrics

  # 啟用 info.*，讓內容出現在 /actuator/info。
  info:
    env:
      enabled: true

  endpoint:
    # 允許 POST http://localhost:8080/actuator/shutdown 優雅關閉並註銷 Eureka；正式環境應保護或關閉此未驗證端點。
    shutdown:
      access: unrestricted

    # 顯示健康檢查明細：binders（Kafka/RabbitMQ）、clientConfigServer、db、
    # discoveryComposite（Eureka 名冊）、diskSpace、liveness/readiness、SSL 等。
    health:
      show-details: always

  # 將 Circuit Breaker 狀態加入 /actuator/health（預設關閉）。這只負責監控顯示，不會啟用或設定 Circuit Breaker。
  health:
    circuitbreakers:
      enabled: true

    # /actuator/env 顯示實際生效的設定值，包含被環境變數覆蓋的值。
    # ⚠ 可能暴露密碼、連線字串等敏感資訊，只適合本機除錯；正式環境請改為 NEVER（預設）或移除 env 端點。
    env:
      show-values: ALWAYS

  # 為指標加上服務名稱，方便 Prometheus／Grafana 區分不同服務。
  metrics:
    tags:
      application: ${spring.application.name}

  # OpenTelemetry 建立跨服務 trace；correlation-id 由自訂 filter/interceptor 處理。
  tracing:
    sampling:
      # 1.0 = 全部採樣；正式環境可調低以減少 span 資料量。
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          # 將 trace span 送到 Tempo；容器環境由 Compose 改用 tempo 主機名。
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # 停用 OTel Metrics 輸出；指標改由 Prometheus 從 /actuator/prometheus 抓取。
  otlp:
    metrics:
      export:
        enabled: false

# Circuit Breaker 統計下游呼叫失敗率，避免持續呼叫故障服務。
# CLOSED 正常呼叫；OPEN 暫停呼叫；HALF_OPEN 放行少量請求測試是否恢復。
# 至少累計 5 次呼叫，且最近 5 次的失敗率達 50% 時暫停呼叫 10 秒；之後只允許 2 次測試請求確認服務是否恢復。
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 5                     # 以最近 5 次呼叫統計成功／失敗
      minimumNumberOfCalls: 5                  # 至少累計 5 次後才計算失敗率
      failureRateThreshold: 50                 # 失敗率達 50% 時切換為 OPEN
      waitDurationInOpenState: 10000           # OPEN 維持 10 秒後進入 HALF_OPEN
      permittedNumberOfCallsInHalfOpenState: 2 # HALF_OPEN 最多放行 2 次測試呼叫

resilience4j.retry:
  configs:
    default:
      maxAttempts: 4                     # 最多執行 4 次，包含第一次呼叫
      waitDuration: 100                  # 第一次重試前等待 100 毫秒
      enableExponentialBackoff: true     # 啟用指數退避：100 → 200 → 400 毫秒
      exponentialBackoffMultiplier: 2    # 每次等待時間乘以 2
      exponentialMaxWaitDuration: 1s     # 單次等待最多 1 秒
      ignoreExceptions: # 以下例外不重試，直接回傳錯誤
        - com.example.account.exception.ResourceNotFoundException
        - com.example.account.exception.CustomerAlreadyExistsException

# Account 內部限流：超過額度時拋出 RequestNotPermitted，交由 fallback 處理。
# instance 是一個執行中的 Account 副本（IntelliJ 的 JVM、Docker container 或 Kubernetes Pod）。
# Gateway 以 user Header 分開計算；這裡不分使用者，所有人共用同一 instance 的額度，多個 instance（JVM、container 或 Pod）則各自計算。
resilience4j.ratelimiter:
  configs:
    default:
      limitForPeriod: 1            # 每個時間窗最多 1 次
      limitRefreshPeriod: 5s       # 每 5 秒補回額度
      timeoutDuration: 0           # 沒額度時立即失敗，不等待
