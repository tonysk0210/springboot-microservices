# 伺服器設定
server:
  port: 8080  # 應用程式監聽的埠號

# 日誌設定
logging:
  level:
    org.hibernate.tool.schema: DEBUG
    org.springframework.jdbc.datasource.init: DEBUG   # 查看 schema.sql 執行情況
  pattern:
    # 自訂 console 輸出格式：時間(綠) 等級(藍) [執行緒](紅) logger名稱(黃) - 訊息
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n"

spring:
  # 應用程式名稱（會用於服務註冊、日誌等）
  # ⚠ 這個名字同時決定去 Config Server 拿哪個檔案：account → config/account.yml
  application:
    name: account

  # 啟動時去 Config Server 抓設定，抓回來的內容疊在「本檔案之上」
  # （同名 key 遠端贏；但環境變數又贏過遠端，所以 compose 的 environment: 仍可當除錯後門）
  #
  # optional: 前綴 = 抓不到也照樣啟動，退回用本檔案的值。
  #   本機開發方便：不必為了跑 account 而先開 configserver。
  #   拿掉 optional: → Config Server 沒開就啟動失敗，正式環境通常要這樣，
  #   免得帶著錯誤（本地舊的）設定上線而不自知。
  #
  # ⚠ 容器環境要把 localhost 換成服務名，容器裡的 localhost 指的是容器自己：
  #     SPRING_CONFIG_IMPORT: "configserver:http://configserver:8071/"
  config:
    import: "optional:configserver:http://localhost:8071/"

  # 資料來源設定 (H2 檔案模式 + AUTO_SERVER：資料會保留到磁碟，且允許多程序連線)
  datasource:
    # 預設本機開發用 H2 檔案模式（~ 為使用者家目錄，不受 JVM 工作目錄影響）；部署時由 SPRING_DATASOURCE_URL 覆寫成外部資料庫
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:~/h2db/accountdb;AUTO_SERVER=true}
    driverClassName: org.h2.Driver       # H2 JDBC 驅動類別
    username: sa                         # 預設使用者名稱
    password: ''                         # 預設密碼為空

  # H2 資料庫控制台設定
  h2:
    console:
      enabled: true                      # 啟用 H2 Web Console，可透過 /h2-console 存取

  # JPA / Hibernate 設定
  jpa:
    # database-platform: org.hibernate.dialect.H2Dialect  # 停用：Hibernate 會依實際連線自動選方言；寫死會導致換 Postgres 時用錯語法
    hibernate:
      ddl-auto: validate                 # 啟動時自動根據 Entity 更新資料表結構 (create/update/validate/none)
    show-sql: true                       # 在 console 印出 Hibernate 執行的 SQL 語句
    properties:
      hibernate:
        format_sql: true                 # 是否格式化 SQL 輸出，預設 true

  # SQL 初始化設定 (Spring Boot 啟動時自動執行 SQL 腳本)
  sql:
    init:
      mode: always                                      # 執行時機： embedded=僅嵌入式DB(mem) / always=每次啟動都執行 / never=不執行。file 模式必須用 always
      schema-locations: classpath:/sql/schema.sql       # DDL 腳本位置 (建立資料表結構)，位於 resources/sql/schema.sql