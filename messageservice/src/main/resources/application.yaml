server:
  port: 9010

spring:
  application:
    name: messageservice

  # RabbitMQ 連線。本服務「所有」業務流量都走這裡，沒有它就完全不會被觸發。
  # 🔑 這四行可以刪掉（Spring Boot 預設就是 localhost/5672/guest/guest），
  #    寫出來只是讓依賴關係看得見 —— 跟 configserver 同一種做法。
  # ⚠ 容器裡的 localhost 是容器自己，要由 compose 覆寫成 SPRING_RABBITMQ_HOST: rabbitmq
  #   （其他服務是靠 common.yml 的 microservice-base 帶進來的）。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # 本機從 Docker 外部 listener 連 Kafka；容器內由 compose 覆寫成 kafka:9092。
  kafka:
    bootstrap-servers: localhost:29092

  cloud:
    # ── 非同步通知（RabbitMQ 與 Kafka 並行示範）────────────────────────────
    function:
      # 分號表示兩條獨立流程；email|sms 是 RabbitMQ，kafkaEmailSms 是 Kafka。
      definition: email|sms;kafkaEmailSms
    stream:
      # 兩個 binder 並存時，沒有明寫 binder 的基礎設施 binding 預設走 RabbitMQ。
      default-binder: rabbit1
      binders:
        rabbit1:
          type: rabbit
        kafka1:
          type: kafka

      bindings:
        # RabbitMQ：account → messageservice → account
        emailsms-in-0: # 名字 = 上面的 definition + -in-0，有函式（email|sms）改不得
          destination: send-communication
          binder: rabbit1
          group: ${spring.application.name} # queue 取固定名字 → 多台不重複、停機不掉訊息
        emailsms-out-0: # 有函式（同一條鏈的輸出）改不得
          destination: communication-sent
          binder: rabbit1

        # Kafka：kafka-send-communication → messageservice → kafka-communication-sent
        kafkaEmailSms-in-0:
          destination: kafka-send-communication
          binder: kafka1
          group: ${spring.application.name}-kafka
        kafkaEmailSms-out-0:
          destination: kafka-communication-sent
          binder: kafka1

management:
  # Compose healthcheck 使用 /actuator/health；readiness/liveness 是 Kubernetes probes 才需要。
  endpoints:
    web:
      exposure:
        include: health

  # ── OpenTelemetry 追蹤 ────────────────────────────────────────────────────
  # 🔑 對本服務特別重要：它沒有 HTTP 請求可以掛 correlation-id
  #    （那套是手寫的 CorrelationIdFilter，只處理 HTTP 標頭）。
  #    traceId 是唯一能把 messageservice 的 log 跟 account 串起來的東西。
  #
  # 🔑 怎麼串起來的：account 用 StreamBridge 送訊息時，OTel 自動在 AMQP header
  #    塞一個 traceparent；這邊收到訊息時再讀回來，於是兩邊 traceId 相同。
  #    整段完全不用寫程式碼。
  #
  # ⚠ 設定名稱與其他四個服務一致，改的時候記得一起改。
  tracing:
    sampling:
      probability: 1.0        # 1.0 = 全部採樣。正式環境通常 0.1

  opentelemetry:
    tracing:
      export:
        otlp:
          # 本機跑 → localhost:4318（Tempo 容器有 ports 映射）
          # 容器跑 → compose 覆寫成 http://tempo:4318/v1/traces
          # ⚠ Tempo 沒開時每 30 秒噴一次 ConnectException 堆疊，屬正常噪音。
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # ⚠⚠ 不能省 —— 少了它每分鐘噴一次 404 ⚠⚠
  # spring-boot-starter-opentelemetry 順帶帶進 micrometer-registry-otlp，
  # 它預設把「指標」也用 OTLP 送到 /v1/metrics，但 Tempo 只收 /v1/traces。
  otlp:
    metrics:
      export:
        enabled: false

logging:
  level:
    org.apache.kafka.clients.consumer.internals.OffsetFetcherUtils: ERROR
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([${spring.application.name:},%X{traceId:-},%X{spanId:-}]) %yellow(%logger{15}) - %msg%n"
