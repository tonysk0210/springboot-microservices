server:
  port: 9010

logging:
  pattern:
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([${spring.application.name:},%X{traceId:-},%X{spanId:-}]) %yellow(%logger{15}) - %msg%n"

spring:
  application:
    name: messageservice

  # RabbitMQ 供 Spring Cloud Bus 廣播 refresh；本機使用 localhost，容器由 Compose 改為 rabbitmq。
  rabbitmq:
    host: localhost
    port: 5672
      username: ${SPRING_RABBITMQ_USERNAME:guest}
      password: ${SPRING_RABBITMQ_PASSWORD:guest}

  # 本機從 Docker 外部 listener 連 Kafka；容器內由 compose 覆寫成 kafka:9092。
  kafka:
    bootstrap-servers: localhost:29092

  cloud:
    # ── 非同步通知（RabbitMQ 與 Kafka 並行示範）────────────────────────────
    function:
      # 分號表示兩條獨立流程（宣告「哪些函式流程要被接上外部世界」）；email|sms 是 RabbitMQ，kafkaEmailSms 是 Kafka。（通常就是 @Bean 方法名）
      definition: email|sms;kafkaEmailSms
    stream:
      # 兩個 binder 並存時，沒有明寫 binder 的基礎設施 binding 預設走 RabbitMQ。
      default-binder: rabbit1
      binders:
        rabbit1:
          type: rabbit
        kafka1:
          type: kafka

      bindings:
        # RabbitMQ：queue → messageservice → exchange
        emailsms-in-0: # 預設輸入 binding 名稱：email|sms 去掉 | 後加上 -in-0；使用預設命名時需一致 （Spring Cloud Stream 內部輸入通道名稱）
          binder: rabbit1
          destination: send-communication # RabbitMQ 讀取的訊息來源的 Exchange 名稱
          group: ${spring.application.name} # queue 名稱：取固定名字 → 每筆訊息只交給其中一個 instance 處理，不重覆處理、停機不掉訊息
        emailsms-out-0: # 預設輸出 binding 名稱：email|sms 去掉 | 後加上 -out-0
          binder: rabbit1
          destination: communication-sent # RabbitMQ 發出的訊息目的地的 Exchange 名稱

        # Kafka：queue → messageservice → exchange
        kafkaEmailSms-in-0:
          binder: kafka1
          destination: kafka-send-communication
          group: ${spring.application.name}-kafka
        kafkaEmailSms-out-0:
          binder: kafka1
          destination: kafka-communication-sent

management:
  # Compose healthcheck 使用 /actuator/health；readiness/liveness 是 Kubernetes probes 才需要。
  endpoints:
    web:
      exposure:
        # functions：列出 Spring Cloud Function catalog 裡所有「可路由的函式名稱」
        # 與其輸入／輸出型別。HTTP 端點的路徑就是這份清單上的名字，打 404 時先看它，
        # 不必去猜 binding 名稱（emailsms-in-0 那種）跟函式名稱的對應關係。
        include: health,prometheus,metrics,functions

  endpoint:
    # 顯示各元件的健康細節；元件通常由 dependency 提供的 HealthIndicator 建立。
    health:
      show-details: always

  # 為指標加上服務名稱，方便 Prometheus／Grafana 區分不同服務。
  metrics:
    tags:
      application: ${spring.application.name}

  # OpenTelemetry 建立訊息處理的 trace；本服務沒有 HTTP correlation-id filter。
  tracing:
    sampling:
      # 1.0 = 全部採樣；正式環境可調低以減少 span 資料量。
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          # 將 trace span 送到 Tempo；容器環境由 Compose 改用 tempo 主機名。
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # 停用 OTel Metrics 輸出；指標改由 Prometheus 從 /actuator/prometheus 抓取。
  otlp:
    metrics:
      export:
        enabled: false
