# =============================================================================
#  Grafana 的資料源設定 —— 開機時自動掛好 Loki，不用手動在畫面上設定
#
#  ⚠ 檔案必須掛到容器的 /etc/grafana/provisioning/datasources/ 底下，
#    Grafana 啟動時只掃那個資料夾。掛錯路徑不會報錯，只是畫面上找不到資料源。
#
#  之後加 Prometheus / Tempo 時，在 datasources: 底下多加幾筆即可。
# =============================================================================
apiVersion: 1

datasources:
  # ── Log ───────────────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    access: proxy          # 由 Grafana 後端去打 Loki（不是瀏覽器直接打）
    # loki 是 compose 裡的服務名 —— 兩個容器在同一個網路才解析得到。
    url: http://loki:3100
    isDefault: true

  # ── Metrics ───────────────────────────────────────────────────────────────
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090

  # ── Traces ────────────────────────────────────────────────────────────────
  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200      # ⚠ 查詢用 3200，不是服務送 span 的 4318
