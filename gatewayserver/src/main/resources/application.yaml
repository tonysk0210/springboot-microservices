# API Gateway —— 對外單一入口，使用非阻塞式 Netty Server。

server:
  port: 8072

spring:
  application:
    name: gatewayserver

  config:
    # 從 ConfigServer 載入設定；容器使用 CONFIGSERVER_HOST，本機預設為 localhost。
    # optional: 表示連線失敗時仍允許 Gateway 啟動。
    import: "optional:configserver:http://${CONFIGSERVER_HOST:localhost}:8071/"

  cloud:
    gateway:
      server:
        webflux:
          # Gateway 打後端服務時，Netty 這一次 HTTP 往返的逾時。
          # 套用到「所有路由」，不需要有斷路器也生效。
          #
          # 🔑 逾時要「越外層越寬鬆」，這三層是一組的：
          #        account 的 Feign read-timeout   2s   ← 最內層
          #        本檔案的 response-timeout       5s
          #        本檔案的 timelimiter            8s   ← 最外層
          #    外層比內層短的話，內層還在努力、外層已經放棄，那些工作全部白做，
          #    而且 log 會出現「gateway 回 504 但 account 明明成功」的矛盾，很難查。
          httpclient:
            # 建立 TCP 連線的上限。⚠ 這個欄位是「毫秒的整數」，寫 1s 會解析失敗。
            # 不含在下面那個 5s 裡，兩個分開算（最壞 1 + 5 = 6 秒）。
            connect-timeout: 1000
            # 送出請求到收到回應的總時長。
            # ⚠ 包含後端「內部」的一切 —— account 查 DB、再用 Feign 打 loan 和 card，
            #   全部算在這 5 秒裡。gateway 只看自己送出到收回來多久。
            response-timeout: 5s

  # RabbitMQ 連線（Spring Cloud Bus 用它接收 refresh 廣播）
  # 🔑 這四行可以全部刪掉 —— Spring Boot 預設就是 localhost/5672/guest/guest。
  #    寫出來只是讓依賴關係看得見，跟 account / loan / card 的寫法一致。
  # ⚠ 容器裡由 compose 覆寫：SPRING_RABBITMQ_HOST: rabbitmq
  # ⚠ RabbitMQ 沒開時服務仍會啟動，但會在背景無限重連，而且收不到 Bus 廣播。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  # Redis —— 限流（RequestRateLimiter）的計數器。
  #
  # 🔑 為什麼不能存在記憶體：多台 gateway 會各算各的，「每秒 1 次」變成實際
  #    可以打 N 次。Redis 是那份「共用的計數器」，Gateway 內建的 Lua 腳本
  #    保證多台同時加也不會算錯。
  #
  # 🔑 這兩行同樣可以刪掉（預設就是 localhost:6379），寫出來讓依賴關係看得見。
  # ⚠ 容器裡由 compose 覆寫：SPRING_DATA_REDIS_HOST: redis
  # ⚠ Redis 沒開時 gateway「還是會啟動成功」（連線是延遲建立的），
  #   但第一個經過限流 filter 的請求就爆 Connection refused ——
  #   那種「啟動正常、一打就死」比啟動失敗難查得多。
  data:
    redis:
      host: localhost
      port: 6379

  # ── OAuth2 資源伺服器 —— Gateway 只「驗」token，發 token 是 Keycloak 的事 ──
  #
  # jwk-set-uri 是 Keycloak 的「公鑰清單」網址。
  # 🔑 Spring 啟動時抓一次公鑰，之後每個 token 都用它「離線」驗簽章 ——
  #    不需要每次請求都去問 Keycloak，這是 JWT 最大的優點。
  #
  # ⚠ 沒設這行的話所有請求 401，而錯誤訊息不會說是缺設定。
  # ⚠ realms/master 是 Keycloak 的預設 realm。正式環境應該另建一個專用 realm，
  #   master 是拿來管理 Keycloak 自己的。
  # ⚠ 位址寫成變數：本機跑 → localhost，容器跑 → compose 覆寫成 keycloak。
  #   ⚠⚠ 但容器裡有個陷阱：token 的 iss（發行者）欄位會是「發 token 時用的位址」。
  #      你用 localhost:7080 拿 token、gateway 用 keycloak:8080 驗，
  #      issuer 對不上會被拒（invalid_token）。解法是兩邊都用同一個位址，
  #      或在 Keycloak 設 KC_HOSTNAME 固定 issuer。
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:7080/realms/master/protocol/openid-connect/certs}

  # ⚠⚠ WebFlux 專屬 —— 少了它 log 上的 traceId / spanId 永遠是空的 ⚠⚠
  #
  # 症狀：Tempo 裡明明查得到 trace（span 有正常送出），但 console 是
  #     [gatewayserver,,] c.e.g.f.RequestTraceFilter - 產生新的 correlation-id...
  #                    ↑ 兩格都空
  #
  # 🔑 原因：log pattern 的 %X{traceId} 撈的是 MDC，而 MDC 是 ThreadLocal。
  #    Reactor 的執行緒會換來換去，預設（limited）只在少數幾個地方同步 MDC。
  #    改成 auto 會自動在每個 operator 邊界把 Reactor Context 的追蹤資訊
  #    同步回 MDC，log 才撈得到。
  #
  # ⚠ 這是 WebFlux 才有的問題。account / loan / card 是 Servlet（一個請求一條
  #   執行緒），MDC 天生就在，不需要這行。
  # ⚠ 代價：每個 operator 邊界多一次 ThreadLocal 存取，有極小的效能開銷。
  reactor:
    context-propagation: auto

eureka:
  instance:
    # 容器裡登記的是 bridge IP（172.18.0.x）—— 容器間通，Windows 連不到。
    prefer-ip-address: true

  client:
    # 不能省 —— 少了它 push 之後服務會從 Eureka 消失（rebind 清空 hostname，
    #   註冊回 400 且無限重試）。診斷見 account 的 application.yaml。
    refresh:
      enable: false

    # fetch-registry 才是關鍵 —— 路由的 lb://ACCOUNT 靠它換成實際位址。
    #    register 只是讓儀表板看得到。
    register-with-eureka: true
    fetch-registry: true

    service-url:
      # 結尾 /eureka/ 不能省（/ 是儀表板網頁）。
      # defaultZone 必須駝峰式，寫成 default-zone 不報錯只失效。
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}

info:
  app:
    name: "gatewayserver"
    description: "Gateway Server App"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh,busrefresh,gateway,circuitbreakers,circuitbreakerevents,prometheus,metrics

  # 每一筆指標都貼上服務名，Grafana 裡才分得出是誰的。
  # ⚠ 不加的話四個服務的 jvm_memory_used_bytes 全混在一起，圖表毫無意義。
  metrics:
    tags:
      application: ${spring.application.name}

  # ── OpenTelemetry 追蹤 ────────────────────────────────────────────────────
  # 🔑 跟手寫的 correlation-id 的差別：
  #      correlation-id  整趟只有一個值，看不出誰先誰後、各花多久
  #      traceId/spanId  每一段一個 span，帶父子關係和起訖時間 → 畫得出瀑布圖
  # ⚠ 兩套目前「並存」，等 Tempo 跑順、確認瀑布圖沒問題再考慮拆掉手寫那套。
  tracing:
    sampling:
      # 1.0 = 全部採樣。⚠ 正式環境通常 0.1（流量大時 span 量非常可觀）。
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          # span 往這裡送。⚠ Boot 4.1 把屬性改名了，舊教材寫的
          #   management.otlp.tracing.endpoint 雖然還能用，但已是相容用途。
          # 本機跑 → localhost:4318（Tempo 容器有 ports 映射）
          # 容器跑 → compose 覆寫成 http://tempo:4318/v1/traces
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # ⚠⚠ 這段不能省 —— 少了它每分鐘噴一次 404 錯誤堆疊 ⚠⚠
  #
  # spring-boot-starter-opentelemetry 順帶帶進 micrometer-registry-otlp，
  # 它預設也會把「指標」用 OTLP 送到 localhost:4318/v1/metrics。
  # 但 Tempo 只收 trace（/v1/traces），收到 /v1/metrics 直接回 404：
  #     WARN OtlpMeterRegistry - Failed to publish metrics to OTLP receiver
  #     ...Server responded with HTTP status code 404
  #
  # 🔑 而且本來就不需要 —— 指標已經由 micrometer-registry-prometheus 負責
  #    （Prometheus 主動來抓 /actuator/prometheus）。兩套並存只是重複又出錯。
  #
  # ⚠ 課程用 agent 那條路，對應的環境變數是 OTEL_METRICS_EXPORTER: none，
  #   目的一模一樣。
  otlp:
    metrics:
      export:
        enabled: false

  # 把斷路器狀態併進 /actuator/health，跳開的那個會顯示 CIRCUIT_OPEN。
  # ⚠ 預設是關的。
  health:
    circuitbreakers:
      enabled: true

  info:
    env:
      enabled: true      # 沒這行 /actuator/info 回空的 {}

  endpoint:
    health:
      show-details: always

    # /actuator/gateway/routes 是查「實際生效的路由」唯一可靠的方法。
    # 要 unrestricted 是因為它能 POST 新增 / DELETE 刪路由。
    # 無驗證就能改路由 = 流量可被導走，正式環境必關。
    gateway:
      access: unrestricted

    env:
      show-values: ALWAYS   # 會印出明文連線字串與密碼，只適合本機

logging:
  level:
    com:
      example:
        gatewayserver: DEBUG # 設定日誌等級
  pattern:
    # 時間(綠) 等級(藍) [執行緒](紅) [服務名,traceId,spanId](洋紅) logger名稱(黃) - 訊息
    #
    # ⚠ 比 account / loan / card 少一格 correlationId —— 那格在這裡永遠是空的。
    #   correlation-id 是我們自己 MDC.put 的，WebFlux 換執行緒就沒了。
    #   Gateway 的 correlation-id 靠 RequestTraceFilter / ResponseTraceFilter 裡的
    #   log.debug 直接寫在訊息裡，不走 pattern。
    # 🔑 traceId / spanId 有值，但「要靠上面的 spring.reactor.context-propagation: auto」——
    #    框架有辦法把它同步回 MDC，我們手寫的 correlation-id 沒有。差別在這裡。
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([${spring.application.name:},%X{traceId:-},%X{spanId:-}]) %yellow(%logger{15}) - %msg%n"

# 斷路器分成兩棵獨立的設定樹，長得像但管的事不同：
#     circuitbreaker  失敗幾次跳開、跳開多久
#     timelimiter     等多久算失敗           ← 改斷路器預設 1 秒的是這棵
#
# CLOSED：正常放行並統計結果；失敗率達門檻後轉為 OPEN，暫時拒絕請求；
# OPEN 等待指定時間後轉為 HALF_OPEN，以少量試探請求判斷下游是否恢復。
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10                    # 以最近 10 次呼叫作為失敗率統計視窗
      permittedNumberOfCallsInHalfOpenState: 2 # HALF_OPEN 狀態最多放行 2 次試探呼叫
      failureRateThreshold: 50                 # 統計視窗內失敗率達 50% 時切換為 OPEN
      waitDurationInOpenState: 10000           # OPEN 維持 10 秒（10000 ms）後進入 HALF_OPEN

# 斷路器包住的整段處理的總時限（含查 Eureka、挑實例、其他 filter），最外層兜底用。
# ⚠ 不寫預設只有 1 秒，第一次呼叫很容易破 → Postman 幾乎立刻跳 fallback。
#   改這個 1 秒只能靠這棵樹，把 httpclient 的 response-timeout 調大沒有用。
# 🔑 要比上面 httpclient 的 5s 大。反過來的話錯誤都變成籠統的 TimeoutException，
#    分不出是「連不上」還是「回得慢」。
resilience4j.timelimiter:
  configs:
    default:
      timeoutDuration: 8s
