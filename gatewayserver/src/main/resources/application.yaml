# API Gateway —— 對外單一入口，使用非阻塞式 Netty Server。

server:
  port: 8072

spring:
  application:
    name: gatewayserver

  config:
    # 從 ConfigServer 載入設定；容器使用 CONFIGSERVER_HOST，本機預設為 localhost。
    # optional: 表示連線失敗時仍允許 Gateway 啟動。
    import: "optional:configserver:http://${CONFIGSERVER_HOST:localhost}:8071/"

eureka:
  instance:
    # 容器裡登記的是 bridge IP（172.18.0.x）—— 容器間通，Windows 連不到。
    prefer-ip-address: true

  client:
    # 不能省 —— 少了它 push 之後服務會從 Eureka 消失（rebind 清空 hostname，
    #   註冊回 400 且無限重試）。診斷見 account 的 application.yaml。
    refresh:
      enable: false

    # fetch-registry 才是關鍵 —— 路由的 lb://ACCOUNT 靠它換成實際位址。
    #    register 只是讓儀表板看得到。
    register-with-eureka: true
    fetch-registry: true

    service-url:
      # 結尾 /eureka/ 不能省（/ 是儀表板網頁）。
      # defaultZone 必須駝峰式，寫成 default-zone 不報錯只失效。
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}

info:
  app:
    name: "gatewayserver"
    description: "Gateway Server App"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        include: health,info,env,refresh,busrefresh,gateway,circuitbreakers,circuitbreakerevents

  # 把斷路器狀態併進 /actuator/health，跳開的那個會顯示 CIRCUIT_OPEN。
  # ⚠ 預設是關的。
  health:
    circuitbreakers:
      enabled: true

  info:
    env:
      enabled: true      # 沒這行 /actuator/info 回空的 {}

  endpoint:
    health:
      show-details: always

    # /actuator/gateway/routes 是查「實際生效的路由」唯一可靠的方法。
    # 要 unrestricted 是因為它能 POST 新增 / DELETE 刪路由。
    # 無驗證就能改路由 = 流量可被導走，正式環境必關。
    gateway:
      access: unrestricted

    env:
      show-values: ALWAYS   # 會印出明文連線字串與密碼，只適合本機

logging:
  level:
    com:
      example:
        gatewayserver: DEBUG # 設定日誌等級

# Resilience4j Circuit Breaker 的共用預設設定。
# CLOSED：正常放行並統計結果；失敗率達門檻後轉為 OPEN，暫時拒絕請求；
# OPEN 等待指定時間後轉為 HALF_OPEN，以少量試探請求判斷下游是否恢復。
resilience4j.circuitbreaker:
  configs:
    default:
      slidingWindowSize: 10                    # 以最近 10 次呼叫作為失敗率統計視窗
      permittedNumberOfCallsInHalfOpenState: 2 # HALF_OPEN 狀態最多放行 2 次試探呼叫
      failureRateThreshold: 50                 # 統計視窗內失敗率達 50% 時切換為 OPEN
      waitDurationInOpenState: 10000           # OPEN 維持 10 秒（10000 ms）後進入 HALF_OPEN
