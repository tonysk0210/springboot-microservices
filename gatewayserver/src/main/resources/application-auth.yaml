# =============================================================================
# auth profile：啟用 Gateway 的 OAuth2/JWT 驗證。
# IntelliJ 可在 Active profiles 填入 auth；Compose 會自動啟用此 profile。
# 未啟用 auth 時，改由 NoAuthSecurityConfig 放行請求。
# =============================================================================
spring:
  # Gateway 只驗證 Keycloak 發出的 JWT，不負責發 token。
  # jwk-set-uri 是 Keycloak 公鑰網址；第一次驗證 token 時才抓取。
  # 本機使用 localhost:7080，Compose 透過環境變數改成 keycloak:8080。
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:7080/realms/master/protocol/openid-connect/certs}
