# auth profile：啟用 Gateway 的 OAuth2/JWT 驗證。
# IntelliJ 需加入 auth；Compose 會自動啟用。
spring:
  # Gateway 只驗證 JWT，不負責發 token。
  # 透過 Keycloak 公鑰確認 token 有效；容器環境由環境變數改用 keycloak:8080。
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:7080/realms/master/protocol/openid-connect/certs}
