# Prometheus 每 15 秒主動抓取各服務的 /actuator/prometheus。
# targets 使用 host.docker.internal，讓服務跑在 IntelliJ 或 Docker 都能被抓到。
# 前提是 Compose 有映射對外 port；位址錯誤可在 http://localhost:9090/targets 查看。
# 修改本檔後可重新載入：curl.exe -XPOST http://localhost:9090/-/reload

global:
  scrape_interval: 15s        # 每 15 秒巡一輪
  evaluation_interval: 15s
  # 間隔越短資料越即時，但會增加 CPU 與儲存量。

scrape_configs:
  # Spring 應用服務
  - job_name: 'account'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8080' ]

  - job_name: 'loan'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8090' ]

  - job_name: 'card'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:9000' ]

  - job_name: 'gatewayserver'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8072' ]

  - job_name: 'messageservice'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:9010' ]

  # 基礎設施服務
  - job_name: 'eurekaserver'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8070' ]

  - job_name: 'configserver'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'host.docker.internal:8071' ]

  # Prometheus 自己也納入監控；localhost 指向 Prometheus 容器本身。
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]
