# Tempo 儲存並提供查詢 trace；microservice 服務透過 OTLP 主動把 span 送到這裡。
# Grafana 使用 3200 查詢，服務使用 4318（HTTP）或 4317（gRPC）傳送。

server:
  http_listen_port: 3200        # Grafana 查詢 Tempo 的 port。

distributor:
  receivers:
    otlp:
      protocols:
        # 接收服務傳來的 span；Spring Boot 預設使用 HTTP 4318。
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

storage:
  trace:
    backend: local              # 儲存在本機；正式環境可改用 S3／GCS。
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal      # 暫存尚未整理的 trace。

# Trace 保留 24 小時，避免本機資料持續增長。
compactor:
  compaction:
    block_retention: 24h
