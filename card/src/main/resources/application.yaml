server:
  port: 9000

logging:
  level:
    org.hibernate.tool.schema: DEBUG
    org.springframework.jdbc.datasource.init: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    # Console log 格式：時間、等級、執行緒、服務名、correlation ID、traceId、spanId、logger 與訊息。
    # %X{...} 從 MDC 讀取追蹤 ID；沒有值時留白。
    console: "%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %magenta([${spring.application.name:},%X{X-Gateway-Correlation-Id:-},%X{traceId:-},%X{spanId:-}]) %yellow(%logger{15}) - %msg%n"

spring:
  application:
    name: card

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/carddb}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:/sql/schema.sql
  # 啟動時向 Config Server 取得設定；遠端同名值會覆蓋本檔案，環境變數優先權更高。
  # optional: 代表 Config Server 無法連線時仍可啟動；CONFIGSERVER_HOST 供本機與容器切換位址。
  # 不要另外設定 SPRING_CONFIG_IMPORT，避免同時執行兩組 import。
  config:
    # 本機預設 optional；Compose / Kubernetes 設空字串後，Config Server 就是必要依賴。
    import: "${CONFIGSERVER_OPTIONAL_PREFIX:optional:}configserver:http://${CONFIGSERVER_HOST:localhost}:8071/"

  # RabbitMQ 供 Spring Cloud Bus 廣播 refresh；本機使用 localhost，容器由 Compose 改為 rabbitmq。
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Eureka Client：向 Eureka 註冊自己，並快取其他服務的清單。
# 需要 pom.xml 的 spring-cloud-starter-netflix-eureka-client。
eureka:
  instance:
    # 註冊實例的 IP，讓其他服務可以連線。
    prefer-ip-address: true
  client:
    # 停用 Eureka 設定的動態 refresh，避免重新綁定時破壞註冊資料。# 修改 eureka.* 設定後需重新啟動服務。
    refresh:
      enable: false
    register-with-eureka: true    # 將自己註冊到 Eureka
    fetch-registry: true          # 取得並定期更新服務清單
    service-url:
      # Compose 使用 eurekaserver；本機預設使用 localhost。
      defaultZone: ${EUREKA_URL:http://localhost:8070/eureka/}

# /actuator/info（Eureka status page 預設連結）；需啟用 management.info.env.enabled 才會顯示。
info:
  app:
    name: "card"
    description: "Bank Card App"
    version: "1.0.0"

management:
  endpoints:
    web:
      exposure:
        # Actuator：health 健康狀態；info 基本資訊；env 查看設定來源。
        # refresh 只更新本服務；busrefresh 經 RabbitMQ 通知所有 Bus 服務；shutdown 優雅關閉。
        # prometheus/metrics 提供監控指標。
        include: health,info,env,refresh,busrefresh,shutdown,prometheus,metrics

  # 啟用 info.*，讓內容出現在 /actuator/info。
  info:
    env:
      enabled: true

  # 允許 POST http://localhost:9000/actuator/shutdown 優雅關閉並註銷 Eureka；正式環境應保護或關閉此未驗證端點。
  endpoint:
    shutdown:
      access: unrestricted

    # 顯示各 HealthIndicator 的詳細狀態，可單獨查詢 /actuator/health/db。
    # ⚠ details 可能暴露資料庫、RabbitMQ、磁碟等內部資訊；正式環境建議使用 never 或 when-authorized，折衷可用 show-components: always。
    health:
      show-details: always

  # 為指標加上服務名稱，方便 Prometheus／Grafana 區分不同服務。
  metrics:
    tags:
      application: ${spring.application.name}

  # OpenTelemetry 建立跨服務 trace；correlation-id 由自訂 filter/interceptor 處理。
  tracing:
    sampling:
      # 1.0 = 全部採樣；正式環境可調低以減少 span 資料量。
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          # 將 trace span 送到 Tempo；容器環境由 Compose 改用 tempo 主機名。
          endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

  # 停用 OTel Metrics 輸出；指標改由 Prometheus 從 /actuator/prometheus 抓取。
  otlp:
    metrics:
      export:
        enabled: false


    # /actuator/env 預設把所有值遮成 ******（Spring Boot 3.0 起）。開了才看得到
    # 實際值，以及「被覆蓋掉的那一層」—— 完整說明見 account 的 application.yaml。
    # ⚠⚠ 只適合本機開發：會印出明文連線字串和密碼，而端點沒有驗證。
    env:
      show-values: ALWAYS


