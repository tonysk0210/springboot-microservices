# account.yml：Config Server 提供給 account 服務的設定。
# 檔名必須對應 spring.application.name=account；可由
# http://localhost:8071/account/default 查看合併後的 JSON 設定來源。

account:
  # 用訊息內容確認服務取得了 Config Server 的遠端設定。
  message: "歡迎使用帳戶相關 API（Git push → Config Server /monitor → RabbitMQ Bus → Docker container 內的微服務 refresh；設定由 Config Server 從 Git 載入）t"

  contact-details:
    name: "Tony Shangkuan - Developer"
    email: '{cipher}0f0c83204472da9aba29cf0a3a07573e6d320e7502dc8fea2d4dbb76eab6eb025aec161e1ffbd58f4b636dc1e62f691e'

  on-call-support:
    - "(02) 1234-5678"
    - "(02) 8765-4321"

# 自訂設定，可由 env.getProperty("build.version") 讀取。
build:
  version: "1.0"

# 可在此覆寫 application.yaml 的 logging 設定；修改 server.port 前要同步更新服務映射。
logging:
  level:
    org.hibernate.tool.schema: DEBUG
